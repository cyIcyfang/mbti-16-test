<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="免費繁體中文十六型人格測驗，60 題約 10–15 分鐘，產出類型解析與結果圖卡。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>十六型人格測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: single centered reading column (max 720px); quiz pages of 10 statements, then a result report */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#1a2130; --muted:#5d6779; --line:#dde2ea;
  --accent:#2f5d8a; --accent-soft:#e3ecf5; --agree:#2f8f6b; --disagree:#8a5a9e;
  --nt:#6a4c93; --nf:#2f8f6b; --sj:#2f6fa8; --sp:#c27f12;
  --f-display:"LXGW WenKai TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-code:"Space Grotesk","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* intro */
.intro{padding-block:48px 24px;display:grid;gap:20px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.intro h1{font-size:clamp(32px,7vw,48px)}
.intro .lead{color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-family:var(--f-code)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dim .pair{font-family:var(--f-code);font-weight:700;font-size:18px}
.dim .q{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:12px 24px;background:var(--accent);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:13px;color:var(--muted)}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.qlist{display:grid;gap:0;margin-top:8px}
.qi{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:16px;transition:opacity .2s}
.qi.done{opacity:.55}
.qi.done:hover,.qi.done:focus-within{opacity:1}
.qi .text{font-size:18px;font-weight:500;text-align:center}
.qi .num{font-family:var(--f-code);color:var(--muted);font-size:13px;margin-right:6px}
.scale{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.scale .lab{font-size:13px;font-weight:700;white-space:nowrap}
.lab.a{color:var(--agree)} .lab.d{color:var(--disagree)}
.dots{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dot{border-radius:50%;border:2px solid;background:transparent;padding:0;flex:none;transition:background .15s,transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.s3{width:44px;height:44px}.dot.s2{width:36px;height:36px}.dot.s1{width:29px;height:29px}.dot.s0{width:22px;height:22px}
.dot.ag{border-color:var(--agree)}.dot.ag.on{background:var(--agree)}
.dot.di{border-color:var(--disagree)}.dot.di.on{background:var(--disagree)}
.dot.ne{border-color:var(--muted)}.dot.ne.on{background:var(--muted)}
@media (max-width:460px){
  .scale{grid-template-columns:1fr 1fr;row-gap:8px}
  .dots{grid-column:1/-1;grid-row:1}
  .lab.d{text-align:right}
  .dot.s3{width:38px;height:38px}.dot.s2{width:32px;height:32px}.dot.s1{width:26px;height:26px}.dot.s0{width:20px;height:20px}
}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}

/* result */
.hero{padding-block:40px 28px;display:grid;gap:10px;text-align:center;justify-items:center}
.code{font-family:var(--f-code);font-weight:700;font-size:clamp(56px,16vw,96px);letter-spacing:.06em;line-height:1;color:var(--grp)}
.hero h1{font-size:clamp(26px,6vw,36px)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;color:var(--grp);border:1px solid var(--grp)}
.hero .sum{max-width:56ch;color:var(--muted)}
.sec{padding-block:24px;border-top:1px solid var(--line);display:grid;gap:14px}
.sec h2{font-size:22px}
.meter{display:grid;gap:6px}
.meter .top{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;gap:8px}
.meter .top b{font-family:var(--f-code)}
.meter .top .win{color:var(--grp)}
.mtrack{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mfill{position:absolute;top:0;bottom:0;background:var(--grp)}
.mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bg)}
.meter .desc{font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.cols,.dims{grid-template-columns:1fr}}
ul.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:14px;padding:4px 12px;border-radius:6px;background:var(--accent-soft)}
.h3{font-size:17px;font-family:var(--f-display);font-weight:700}
.toast{font-size:14px;color:var(--agree);min-height:1.5em}
.card img{display:block;width:100%;max-width:480px;margin:0 auto;border-radius:12px;border:1px solid var(--line);aspect-ratio:4/5;background:var(--surface)}
textarea{width:100%;min-height:160px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DIMS={
 EI:{a:'E',an:'外向',b:'I',bn:'內向',q:'你的能量從哪裡來？',
   ad:'你從與人互動、參與外在活動中獲得能量，習慣邊說邊想、邊做邊調整。',
   bd:'你從獨處與內在思考中恢復能量，習慣先想清楚再表達或行動。'},
 SN:{a:'S',an:'實感',b:'N',bn:'直覺',q:'你如何接收資訊？',
   ad:'你重視具體事實與親身經驗，關注當下與細節，偏好實用的做法。',
   bd:'你重視整體模式與可能性，關注未來與意義，喜歡新點子和抽象概念。'},

   ad:'你做決定時以邏輯、客觀標準為主，重視公平與效率。',

 JP:{a:'J',an:'判斷',b:'P',bn:'感知',q:'你如何面對外在生活？',
   ad:'你喜歡事先規劃、按部就班，事情有結論會讓你比較安心。',
   bd:'你喜歡保留彈性、隨機應變，享受開放與探索的過程。'}
};
// [題目, 向度, 方向] 方向 +1 = 同意偏向第一個字母 (E/S/T/J)
const RAW={
EI:[['在聚會中，我通常會主動認識新朋友。',1],['和一大群人相處一整天後，我需要獨處來恢復精力。',-1],['我習慣邊說邊想，透過討論來整理想法。',1],['比起大型聚會，我更喜歡和一兩位好友深聊。',-1],['在團體中，我常是帶動氣氛的人。',1],['遇到問題時，我傾向先自己想清楚再跟別人說。',-1],['一個人在家過週末，讓我覺得很充實。',-1],['我很容易和陌生人聊起來。',1],['電話響起時，我會有點希望不用接。',-1],['參加活動時，我喜歡同時和很多人互動。',1],['在會議或課堂上，我常是第一個發言的人。',1],['比起當面溝通，我更喜歡用文字訊息。',-1],['太久沒有和人互動，我會覺得悶。',1],['常有人說「很難看出你在想什麼」。',-1],['我喜歡在熱鬧、有人走動的環境中工作。',1]],
SN:[['我比較相信親身經驗，而不是理論推測。',1],['我常會想像未來可能發生的各種情境。',-1],['做事時，我習慣照著已經驗證有效的方法。',1],['我容易被抽象概念或哲學問題吸引。',-1],['我注意細節，常發現別人沒注意到的地方。',1],['讀書或看電影時，我更在意背後的象徵和意義。',-1],['描述事情時，我會說出具體的時間、地點和數字。',1],['我常有天馬行空的點子，但不一定會去實行。',-1],['我喜歡實用、能馬上派上用場的知識。',1],['我常在不同事物之間看出別人沒發現的關聯。',-1],['比起「可能會怎樣」，我更關心「現在是怎樣」。',1],['一成不變的例行工作，很快會讓我失去耐心。',-1],['學新東西時，我喜歡先看實際範例，再理解原理。',1],['我常會想「如果……會怎樣？」',-1],['別人常說我是腳踏實地、務實的人。',1]],

JP:[['我喜歡事先把行程規劃好。',1],['我常在截止日前才開始全力衝刺。',-1],['我的桌面和房間通常井然有序。',1],['旅行時，我喜歡隨興走，不排太滿的行程。',-1],['事情有明確結論後，我才會覺得安心。',1],['計畫臨時改變時，我通常能很快適應。',-1],['我習慣列待辦清單，並一項項完成。',1],['我喜歡保留選擇空間，不想太早做決定。',-1],['我會先把工作做完，再去玩。',1],['我常同時開始好幾件事，但不一定都完成。',-1],['守時對我來說很重要。',1],['規則和流程常讓我覺得被綁住。',-1],['做了決定之後，我很少再反覆更改。',1],['我覺得在壓力下臨場發揮，反而效率更好。',-1],['我會提前準備，避免最後一刻手忙腳亂。',1]]

ENTP:['點子激盪者','反應快、愛挑戰，喜歡從不同角度切入問題。討論和辯論對他來說是一種樂趣，常帶來新鮮的想法。',['創意多、思考靈活','口才好，能快速抓到重點','不怕挑戰傳統做法','適應力強，面對變化不慌亂'],['容易三分鐘熱度，難以堅持到完成','辯論過頭可能讓人覺得不被尊重','對例行性工作缺乏耐心'],'適合變化多、能提案與創新的工作。',['行銷企劃','創業','媒體記者','顧問','產品開發'],'有趣、充滿驚喜，喜歡能互相激盪的對象；要留意別把爭論帶進感情。',['挑一個點子，堅持做到完成','爭論前先確認對方是否想討論','把執行細節交給擅長的夥伴，並尊重他們']],

const KEY='mbti16-tc-v1';
let S={view:'intro',page:0,ans:Array(Q.length).fill(null)};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.ans)&&s.ans.length===Q.length)S=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const answered=()=>S.ans.filter(v=>v!==null).length;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(){({intro,quiz,result})[S.view]();}

function intro(){
  const n=answered();
  app.innerHTML=`<section class="intro">
    <div class="eyebrow">免費・繁體中文・約 10–15 分鐘</div>
    <h1>十六型人格測驗</h1>
    <p class="lead">共 60 題。請依照你「平常、自然的樣子」作答，而不是你希望自己成為的樣子。沒有對錯，第一直覺通常最準。</p>
    <div class="facts"><span><b>60</b> 題</span><span><b>4</b> 個向度</span><span><b>16</b> 種類型</span><span>作答進度會自動保存在此瀏覽器</span></div>
    <div class="dims">${Object.values(DIMS).map(d=>`<div class="dim"><div class="pair">${d.a} ${d.an} ／ ${d.b} ${d.bn}</div><div class="q">${d.q}</div></div>`).join('')}</div>
    <div class="row">
      <button class="btn" id="go">${n?`繼續作答（已完成 ${n} 題）`:'開始測驗'}</button>
      ${n?'<button class="btn ghost" id="reset">重新開始</button>':''}
    </div>
    <p class="note">本測驗依據榮格心理類型理論設計，供自我探索與教學討論使用，並非官方 MBTI®，也不適合作為招募或診斷依據。</p>
  </section>`;
  document.getElementById('go').onclick=()=>{S.view=n===Q.length?'result':'quiz';save();render();scrollTo(0,0)};
  const r=document.getElementById('reset');if(r)r.onclick=reset;
}

function reset(){S={view:'quiz',page:0,ans:Array(Q.length).fill(null)};save();render();scrollTo(0,0);}

const VALS=[3,2,1,0,-1,-2,-3];
function quiz(){
  const start=S.page*PER,items=Q.slice(start,start+PER);
  app.innerHTML=`<div class="bar"><div class="meta"><span>第 ${S.page+1} / ${PAGES} 頁</span><span id="cnt"></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="qlist">${items.map((q,k)=>{const i=start+k;return `<div class="qi${S.ans[i]!==null?' done':''}" id="q${i}">
    <p class="text"><span class="num">${i+1}</span>${q.t}</p>
    <div class="scale"><span class="lab a">同意</span>
      <div class="dots" role="radiogroup" aria-label="第${i+1}題">${VALS.map(v=>{const c=v>0?'ag':v<0?'di':'ne';return `<button class="dot s${Math.abs(v)} ${c}${S.ans[i]===v?' on':''}" role="radio" aria-checked="${S.ans[i]===v}" aria-label="${['非常同意','同意','有點同意','中立','有點不同意','不同意','非常不同意'][3-v]}" data-i="${i}" data-v="${v}"></button>`}).join('')}</div>
      <span class="lab d">不同意</span></div></div>`}).join('')}</div>
  <div class="nav"><button class="btn ghost" id="prev">${S.page?'上一頁':'回首頁'}</button><button class="btn" id="next">${S.page===PAGES-1?'看結果':'下一頁'}</button></div>
  <p class="note" style="margin-top:12px;text-align:center">中間的小圓圈代表「中立」，請盡量少用。</p>`;
  const upd=()=>{const n=answered();document.getElementById('cnt').textContent=`已完成 ${n} / ${Q.length}`;document.getElementById('fill').style.width=(n/Q.length*100)+'%';
    document.getElementById('next').disabled=items.some((_,k)=>S.ans[start+k]===null);};
  upd();
  app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,v=+b.dataset.v,first=S.ans[i]===null;S.ans[i]=v;save();
    const box=document.getElementById('q'+i);box.classList.add('done');
    box.querySelectorAll('.dot').forEach(d=>{const on=+d.dataset.v===v;d.classList.toggle('on',on);d.setAttribute('aria-checked',on)});
    upd();
    if(first){for(let j=i+1;j<start+items.length;j++){if(S.ans[j]===null){const el=document.getElementById('q'+j);const y=el.getBoundingClientRect().top+scrollY-110;scrollTo({top:y,behavior:reduce?'auto':'smooth'});break;}}}
  });
  document.getElementById('prev').onclick=()=>{if(S.page)S.page--;else S.view='intro';save();render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{if(S.page<PAGES-1){S.page++;}else{S.view='result';}save();render();scrollTo(0,0)};
}

function score(){
  const out={};
  for(const d in DIMS){let s=0;Q.forEach((q,i)=>{if(q.d===d)s+=(S.ans[i]||0)*q.dir});
    const pa=Math.round(50+s/45*50);out[d]={pa,pb:100-pa,win:pa>=50?DIMS[d].a:DIMS[d].b};}
  return out;
}
const level=p=>{const x=Math.abs(p-50);return x<10?'輕微偏好':x<25?'中等偏好':x<40?'明顯偏好':'非常明顯'};
function group(code){return code[1]==='N'?(code[2]==='T'?'NT':'NF'):(code[3]==='J'?'SJ':'SP');}

function result(){
  const sc=score(),code=Object.keys(DIMS).map(d=>sc[d].win).join(''),t=T[code],g=group(code);
  app.style.setProperty('--grp',`var(${GROUPS[g][1]})`);
  const meters=Object.entries(DIMS).map(([k,d])=>{const r=sc[k],aw=r.win===d.a;const p=aw?r.pa:r.pb;
    const fill=aw?`right:50%;width:${p-50}%`:`left:50%;width:${p-50}%`;
    return `<div class="meter"><div class="top"><span class="${aw?'win':''}"><b>${d.a}</b> ${d.an} ${r.pa}%</span><span style="color:var(--muted)">${level(p)}</span><span class="${aw?'':'win'}">${r.pb}% ${d.bn} <b>${d.b}</b></span></div>
    <div class="mtrack"><div class="mfill" style="${fill}"></div><div class="mid"></div></div>
    <p class="desc">${aw?d.ad:d.bd}${Math.abs(p-50)<10?' 這個向度兩邊很接近，你可能會依情境在兩者之間切換。':''}</p></div>`}).join('');
  app.innerHTML=`<section class="hero">
    <span class="chip">${GROUPS[g][0]}</span>
    <div class="code">${code}</div>
    <h1>${t[0]}</h1>
    <p class="sum">${t[1]}</p></section>
  <section class="sec"><h2>四個向度的分數</h2>${meters}</section>
  <section class="sec"><div class="cols">
    <div><p class="h3">你的優勢</p><ul class="list">${t[2].map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div><p class="h3">需要留意的盲點</p><ul class="list">${t[3].map(x=>`<li>${x}</li>`).join('')}</ul></div></div></section>
  <section class="sec"><h2>工作與職涯</h2><p>${t[4]}</p><div class="tags">${t[5].map(x=>`<span class="tag">${x}</span>`).join('')}</div>
    <p class="note">職業僅供參考。任何類型都能在各種領域表現出色，興趣與能力同樣重要。</p></section>
  <section class="sec"><h2>人際與感情</h2><p>${t[6]}</p></section>
  <section class="sec"><h2>成長建議</h2><ul class="list">${t[7].map(x=>`<li>${x}</li>`).join('')}</ul></section>
  <section class="sec"><h2>結果圖卡</h2><p class="note">手機請長按圖片選「儲存圖片」；電腦請在圖片上按右鍵「另存圖片」。</p><div class="card"><img id="cardimg" alt="${code} ${t[0]} 結果圖卡"></div></section>
  <section class="sec"><h2>文字版解析</h2><p class="note">複製下方文字，即可貼到筆記或傳給朋友。</p>
    <textarea id="txt" readonly></textarea>
    <div class="row"><button class="btn" id="copy">複製解析</button><button class="btn ghost" id="redo">重新測驗</button><button class="btn ghost" id="edit">修改答案</button></div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <p class="note">提醒：人格類型描述的是偏好，不是能力或限制。結果可能隨年齡、環境與心境改變，建議當作認識自己的起點。</p></section>`;
  const txt=`【十六型人格測驗結果】\n類型：${code}｜${t[0]}（${GROUPS[g][0]}）\n${t[1]}\n\n向度分數：\n`+
    Object.entries(DIMS).map(([k,d])=>`・${d.a} ${d.an} ${sc[k].pa}% ／ ${d.b} ${d.bn} ${sc[k].pb}%`).join('\n')+
    `\n\n優勢：${t[2].join('、')}\n盲點：${t[3].join('、')}\n工作：${t[4]}\n適合方向：${t[5].join('、')}\n人際：${t[6]}\n成長建議：\n${t[7].map((x,i)=>`${i+1}. ${x}`).join('\n')}`;
  const ta=document.getElementById('txt');ta.value=txt;
  document.getElementById('copy').onclick=()=>{const toast=document.getElementById('toast');
    navigator.clipboard.writeText(txt).then(()=>toast.textContent='已複製到剪貼簿').catch(()=>{ta.focus();ta.select();toast.textContent='已選取文字，請按 Ctrl/⌘ + C 複製'});};
  document.getElementById('redo').onclick=reset;

  document.getElementById('edit').onclick=()=>{S.view='quiz';S.page=0;save();render();scrollTo(0,0)};
}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function wrapText(x,text,maxW){const P='，。、；：！？）」』';const lines=[];let cur='';for(const ch of text){if(cur&&!P.includes(ch)&&x.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}if(cur)lines.push(cur);return lines;}
async function makeCard(code,t,g,sc){
