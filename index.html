<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="免費十六型人格測驗（繁中／简中／English），60 題約 10–15 分鐘，產出類型解析與結果圖卡。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>十六型人格測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: single centered reading column (max 720px); language switch on top, quiz pages of 10 statements, then a result report */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#1a2130; --muted:#5d6779; --line:#dde2ea;
  --accent:#2f5d8a; --accent-soft:#e3ecf5; --agree:#2f8f6b; --disagree:#8a5a9e;
  --nt:#6a4c93; --nf:#2f8f6b; --sj:#2f6fa8; --sp:#c27f12;
  --f-display:"LXGW WenKai TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-code:"Space Grotesk","Noto Sans TC",sans-serif;
}
:root[lang^="zh-Hans"]{--f-display:"Noto Serif SC","Noto Sans SC",serif;--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--f-code:"Space Grotesk","Noto Sans SC",sans-serif}
:root[lang="en"]{--f-display:"Space Grotesk","Inter",sans-serif;--f-body:"Inter","Helvetica Neue",Arial,sans-serif;--f-code:"Space Grotesk","Inter",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{display:flex;justify-content:flex-end;padding-top:16px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font-size:13px;font-weight:500;font-family:var(--f-body)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}

/* intro */
.intro{padding-block:24px 24px;display:grid;gap:20px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.intro h1{font-size:clamp(32px,7vw,48px)}
.intro .lead{color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-family:var(--f-code)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dim .pair{font-family:var(--f-code);font-weight:700;font-size:17px}
.dim .q{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:12px 24px;background:var(--accent);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:13px;color:var(--muted)}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.qlist{display:grid;gap:0;margin-top:8px}
.qi{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:16px;transition:opacity .2s}
.qi.done{opacity:.55}
.qi.done:hover,.qi.done:focus-within{opacity:1}
.qi .text{font-size:18px;font-weight:500;text-align:center}
.qi .num{font-family:var(--f-code);color:var(--muted);font-size:13px;margin-right:6px}
.scale{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.scale .lab{font-size:13px;font-weight:700;white-space:nowrap}
.lab.a{color:var(--agree)} .lab.d{color:var(--disagree)}
.dots{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dot{border-radius:50%;border:2px solid;background:transparent;padding:0;flex:none;transition:background .15s,transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.s3{width:44px;height:44px}.dot.s2{width:36px;height:36px}.dot.s1{width:29px;height:29px}.dot.s0{width:22px;height:22px}
.dot.ag{border-color:var(--agree)}.dot.ag.on{background:var(--agree)}
.dot.di{border-color:var(--disagree)}.dot.di.on{background:var(--disagree)}
.dot.ne{border-color:var(--muted)}.dot.ne.on{background:var(--muted)}
@media (max-width:460px){
  .scale{grid-template-columns:1fr 1fr;row-gap:8px}
  .dots{grid-column:1/-1;grid-row:1}
  .lab.d{text-align:right}
  .dot.s3{width:38px;height:38px}.dot.s2{width:32px;height:32px}.dot.s1{width:26px;height:26px}.dot.s0{width:20px;height:20px}
}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}

/* result */
.hero{padding-block:28px 28px;display:grid;gap:10px;text-align:center;justify-items:center}
.code{font-family:var(--f-code);font-weight:700;font-size:clamp(56px,16vw,96px);letter-spacing:.06em;line-height:1;color:var(--grp)}
.hero h1{font-size:clamp(26px,6vw,36px)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;color:var(--grp);border:1px solid var(--grp)}
.hero .sum{max-width:56ch;color:var(--muted)}
.sec{padding-block:24px;border-top:1px solid var(--line);display:grid;gap:14px}
.sec h2{font-size:22px}
.meter{display:grid;gap:6px}
.meter .top2{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.meter .top2 b{font-family:var(--f-code)}
.meter .top2 .win{color:var(--grp)}
.mtrack{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mfill{position:absolute;top:0;bottom:0;background:var(--grp)}
.mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bg)}
.meter .desc{font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.cols,.dims{grid-template-columns:1fr}}
ul.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:14px;padding:4px 12px;border-radius:6px;background:var(--accent-soft)}
.h3{font-size:17px;font-family:var(--f-display);font-weight:700}
.toast{font-size:14px;color:var(--agree);min-height:1.5em}
.card img{display:block;width:100%;max-width:480px;margin:0 auto;border-radius:12px;border:1px solid var(--line);aspect-ratio:4/5;background:var(--surface)}
textarea{width:100%;min-height:160px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

", "和一大群人相處一整天後，我需要獨處來恢復精力。", "我習慣邊說邊想，透過討論來整理想法。", "比起大型聚會，我更喜歡和一兩位好友深聊。", "在團體中，我常是帶動氣氛的人。", "遇到問題時，我傾向先自己想清楚再跟別人說。", "一個人在家過週末，讓我覺得很充實。", "我很容易和陌生人聊起來。", "電話響起時，我會有點希望不用接。", "參加活動時，我喜歡同時和很多人互動。", "在會議或課堂上，我常是第一個發言的人。", "比起當面溝通，我更喜歡用文字訊息。", "太久沒有和人互動，我會覺得悶。", "常有人說「很難看出你在想什麼」。", "我喜歡在熱鬧、有人走動的環境中工作。"], "SN": ["我比較相信親身經驗，而不是理論推測。", "我常會想像未來可能發生的各種情境。", "做事時，我習慣照著已經驗證有效的方法。", "我容易被抽象概念或哲學問題吸引。", "我注意細節，常發現別人沒注意到的地方。", "讀書或看電影時，我更在意背後的象徵和意義。", "描述事情時，我會說出具體的時間、地點和數字。", "我常有天馬行空的點子，但不一定會去實行。", "我喜歡實用、能馬上派上用場的知識。", "我常在不同事物之間看出別人沒發現的關聯。", "比起「可能會怎樣」，我更關心「現在是怎樣」。", "一成不變的例行工作，很快會讓我失去耐心。", "學新東西時，我喜歡先看實際範例，再理解原理。", "我常會想「如果……會怎樣？」", "別人常說我是腳踏實地、務實的人。"], "TF": ["做決定時，我優先考慮邏輯和客觀事實。", "我很容易察覺別人的情緒變化。", "我認為直接指出問題，比顧及對方感受更重要。", "看到別人難過時，我也會跟著難受。", "爭論時，我在意的是誰的論點比較正確。", "做決定時，我會先考慮這對身邊的人有什麼影響。", "別人說我有時太理性、不夠體貼。", "維持團體和諧，對我來說很重要。", "我覺得規則應該一視同仁，不該因人情而例外。", "我很難拒絕別人的請求。", "比起被喜歡，我更在意被認為有能力。", "給別人負面意見時，我會花很多心思斟酌用字。", "我喜歡分析問題的原因，找出最有效率的解法。", "我常依照內心的價值觀和感覺來做選擇。", "朋友找我傾訴時，我的第一反應是幫他想辦法解決。"], "JP": ["我喜歡事先把行程規劃好。", "我常在截止日前才開始全力衝刺。", "我的桌面和房間通常井然有序。", "旅行時，我喜歡隨興走，不排太滿的行程。", "事情有明確結論後，我才會覺得安心。", "計畫臨時改變時，我通常能很快適應。", "我習慣列待辦清單，並一項項完成。", "我喜歡保留選擇空間，不想太早做決定。", "我會先把工作做完，再去玩。", "我常同時開始好幾件事，但不一定都完成。", "守時對我來說很重要。", "規則和流程常讓我覺得被綁住。", "做了決定之後，我很少再反覆更改。", "我覺得在壓力下臨場發揮，反而效率更好。", "我會提前準備，避免最後一刻手忙腳亂。"]}, "groups": {"NT": "理性分析型", "NF": "價值理想型", "SJ": "穩健守護型", "SP": "靈活探索型"}, "types": {"INTJ": ["遠見策略家", "獨立、理性，擅長看見長遠的全局並規劃步驟。對自己和他人的標準都高，喜歡把複雜問題變成有系統的方案。", ["能看見長期趨勢並擬定策略", "獨立思考，不輕易隨波逐流", "學習新領域的速度快", "對目標有高度決心"], ["容易顯得冷淡或不好親近", "對效率低落的人事缺乏耐心", "可能低估情緒在決策中的份量"], "喜歡自主度高、能深入鑽研的工作，討厭沒有意義的會議與繁文縟節。", ["策略規劃", "系統架構", "研究員", "數據分析", "產品經理"], "重視少數深交，表達關心的方式常是「幫你解決問題」。需要對方理解他的獨處需求。", ["提出結論前，先問問別人的感受與想法", "接受「夠好」有時比「完美」更有價值", "練習把思考過程說出來，讓別人跟得上"]], "INTP": ["原理探究者", "好奇心旺盛，喜歡拆解事物背後的原理。思考彈性大，享受理論與點子本身帶來的樂趣。", ["分析力強，能抓出邏輯漏洞", "思想開放，願意接受新觀點", "擅長抽象思考與建立模型", "面對問題冷靜客觀"], ["常停在思考階段，不容易落實", "容易疏忽日常瑣事與細節", "有時忽略他人情緒，說話太直"], "適合需要解決複雜問題、允許自由探索的環境。", ["程式設計", "科學研究", "學術工作", "工程師", "遊戲設計"], "對親近的人很忠誠，但不擅長 負責，做事一步一腳印。重視規則與承諾，是團隊中最讓人放心的人。", ["負責任、說到做到", "注重細節、做事精確", "有條理、善於規劃流程", "冷靜穩定，面對壓力不慌"], ["對改變和新方法較抗拒", "可能顯得固執、不夠變通", "不太擅長表達情緒"], "適合結構清楚、重視準確度的工作。", ["會計財務", "行政管理", "工程", "品質管理", "公務人員"], "用實際行動表達愛，忠誠可靠；可以試著多用言語表達關心。", ["試著用新方法完成一件小事", "先聽完別人的想法再判斷", "偶爾說出感謝與感受"]], "ISFJ": ["細心守護者", "溫和、體貼，默默照顧身邊的人。記得別人的小細節，重視傳統與穩定。", ["細心體貼，觀察入微", "可靠、有耐心", "務實，能把事情做得周到", "重視團隊與家庭"], ["容易委屈自己、不好意思拒絕", "對變動感到不安", "付出不被看見時容易受傷"], "適合能照顧他人、步調穩定的工作。", ["護理醫療", "教育", "行政支援", "客戶服務", "社工"], "溫柔忠誠，會默默記得對方的喜好；自己也需要被看見與感謝。", ["練習直接說出自己的需求", "把「別人的期待」和「自己的責任」分開", "給新事物一點機會"]], "ESTJ": ["秩序管理者", "務實、有組織力，擅長建立規則和流程讓事情順利運作。直接坦率，重視效率與責任。", ["組織與執行力強", "做事有效率、重結果", "誠實直接、值得信賴", "能清楚分配任務"], ["對不同做法缺乏彈性", "說話可能太直，讓人感到壓力", "容易忽略情緒面的需求"], "適合需要管理、制度與明確成果的職位。", ["管理職", "營運", "財務", "法律", "軍警"], "重視承諾與責任，會為家人打點一切；可以多保留一些彈性與浪漫。", ["決定前先問「還有其他做法嗎？」", "給回饋時先肯定、再建議", "允許別人用自己的方式完成"]], "ESFJ": ["溫暖協調者", "熱心、合群，樂於照顧大家的需要。擅長營造和諧氣氛，是團體裡的黏著劑。", ["熱心助人、善於照顧", "人際關係良好", "有責任感、可靠", "擅長協調與安排活動"], ["太在意別人的評價", "不容易接受批評", "可能為了和諧而壓抑自己的意見"], "適合與人接觸、分工明確的環境。", ["教育", "醫護", "人力資源", "活動企劃", "客戶服務"], "體貼周到，重視節日與儀式感；需要對方給予肯定與回應。", ["不必讓每個人都滿意", "把批評當成資訊，而不是否定", "練習說出不同的意見"]], "ISTP": ["冷靜工匠", "冷靜、務實，喜歡動手了解事物如何運作。遇到突發狀況反應快，擅長找出實際的解法。", ["冷靜沉著、臨危不亂", "動手與解決問題的能力強", "獨立、有效率", "觀察力敏銳"], ["不喜歡長期承諾與規劃", "不擅長表達情感", "容易對無聊的事失去興趣"], "適合能動手操作、自由度高的工作。", ["工程技術", "機械維修", "資訊安全", "運動相關", "消防救護"], "給彼此空間，用行動陪伴；可以多分享一些內心的想法。", ["試著設定一個長期目標", "用簡單的話說出自己的感受", "做決定前想想對他人的影響"]], "ISFP": ["自在創作者", "溫和、敏感，活在當下並享受生活中的美感。不愛張揚，但有自己獨特的品味與堅持。", ["審美敏銳、富有藝術感", "溫柔包容、不批判他人", "活在當下、懂得享受", "適應力好"], ["不喜歡規劃未來", "遇到衝突傾向退縮", "容易低估自己的能力"], "適合有創作空間、氣氛和諧的工作。", ["設計", "攝影", "手作工藝", "美容美髮", "動物照護"], "溫柔體貼，用行動和小驚喜表達愛；需要被尊重、不被催促。", ["替重要的事加一點結構", "練習在衝突中表達立場", "讓別人看見你的作品和想法"]], "ESTP": ["行動實踐家", "精力充沛、反應快，喜歡從做中學。擅長觀察現場狀況，抓住機會立即行動。", ["行動力強、敢冒險", "臨場反應與談判能力好", "務實，重視實際效果", "幽默、善於社交"], ["容易衝動，忽略長期後果", "對理論與規劃缺乏耐心", "可能不經意說話傷人"], "適合節奏快、能直接看到成果的工作。", ["業務", "創業", "運動教練", "警消救護", "活動執行"], "有趣、愛冒險，帶來很多新鮮體驗；要留意對方是否需要更多穩定感。", ["重要決定前停一下，想想三個月後", "培養一項需要長期累積的技能", "說話前想想對方的感受"]], "ESFP": ["舞台活力家", "開朗、熱情，喜歡和人一起享受生活。天生有表演魅力，能讓周遭氣氛熱絡起來。", ["樂觀開朗、帶動氣氛", "善於觀察他人需求", "務實、懂得享受當下", "適應力強"], ["不喜歡長期規劃", "容易受情緒與誘惑影響", "面對嚴肅問題時傾向逃避"], "適合與人互動、有表現機會的工作。", ["表演藝術", "活動主持", "業務", "餐飲服務", "幼兒教育"], "熱情慷慨，喜歡一起體驗新事物；也要學著面對關係中的難題。", ["每月設定一個小儲蓄或學習目標", "遇到問題先處理，再放鬆", "給自己安靜反思的時間"]]}}, "zh-Hans": {"meta": {"htmlLang": "zh-Hans-CN", "title": "十六型人格测验", "sep": "、", "colon": "："}, "ui": {"eyebrow": "免费・约 10–15 分钟", "lead": "共 60 题。请依照你“平常、自然的样子”作答，而不是你希望自己成为的样子。没有对错，第一直觉通常最准。", "facts": ["<b>60</b> 题", "<b>4</b> 个向度", "<b>16</b> 种类型", "作答进度会自动保存在此浏览器"], "start": "开始测验", "resume": "继续作答（已完成 {n} 题）", "restart": "重新开始", "disclaimer": "本测验依据荣格心理类型理论设计，供自我探索与教学讨论使用，并非官方 MBTI®，也不适合作为招募或诊断依据。", "pageOf": "第 {p} / {n} 页", "done": "已完成 {n} / {t}", "agree": "同意", "disagree": "不同意", "qLabel": "第 {n} 题", "likert": ["非常同意", "同意", "有点同意", "中立", "有点不同意", "不同意", "非常不同意"], "prev": "上一页", "home": "回首页", "next": "下一页", "see": "看结果", "neutralHint": "中间的小圆圈代表“中立”，请尽量少用。", "secScores": "四个向度的分数", "close": "这个向度两边很接近，你可能会依情境在两者之间切换。", "levels": ["轻微偏好", "中等偏好", "明显偏好", "非常明显"], "strengths": "你的优势", "blind": "需要留意的盲点", "work": "工作与职涯", "careerNote": "职业仅供参考。任何类型都能在各种领域表现出色，兴趣与能力同样重要。", "rel": "人际与感情", "growth": "成长建议", "cardH": "结果图卡", "cardNote": "手机请长按图片选“保存图片”；电脑请在图片上按右键“另存图片”。", "cardAlt": "结果图卡", "textH": "文本版解析", "textNote": "拷贝下方文本，即可贴到笔记或传给朋友。", "copy": "拷贝解析", "redo": "重新测验", "edit": "修改答案", "copied": "已拷贝到剪贴板", "selected": "已选取文本，请按 Ctrl/⌘ + C 拷贝", "finalNote": "提醒：人格类型描述的是偏好，不是能力或限制。结果可能随年龄、环境与心境改变，建议当作认识自己的起点。", "txtTitle": "【十六型人格测验结果】", "txtType": "类型", "txtScores": "向度分数", "txtStr": "优势", "txtBlind": "盲点", "txtWork": "工作", "txtCareer": "适合方向", "txtRel": "人际", "txtGrowth": "成长建议", "cardFooter": "以荣格心理类型理论为基础・仅供自我探索参考"}, "dims": {"EI": {"an": "外向", "bn": "内向", "q": "你的能量从哪里来？", "ad": "你从与人交互、参与外在活动中获得能量，习惯边说边想、边做边调整。", "bd": "你从独处与内在思考中恢复能量，习惯先想清楚再表达或行动。"}, "SN": {"an": "实感", "bn": "直觉", "q": "你如何接收信息？", "ad": "你重视具体事实与亲身经验，关注当下与细节，偏好实用的做法。", "bd": "你重视整体模式与可能性，关注未来与意义，喜欢新点子和抽象概念。"}, "TF": {"an": "思考", "bn": "情感", "q": "你如何做决定？", "ad": "你做决定时以逻辑、客观标准为主，重视公平与效率。", "bd": "你做决定时以价值观与人的感受为主，重视和谐与体谅。"}, "JP": {"an": "判断", "bn": "感知", "q": "你如何面对外在生活？", "ad": "你喜欢事先规划、按部就班，事情有结论会让你比较安心。", "bd": "你喜欢保留弹性、随机应变，享受开放与探索的过程。"}}, "q": {"EI": ["在聚会中，我通常会主动认识新朋友。", "和一大群人相处一整天后，我需要独处来恢复精力。", "我习惯边说边想，通过讨论来整理想法。", "比起大型聚会，我更喜欢和一两位好友深聊。", "在团体中，我常是带动气氛的人。", "遇到问题时，我倾向先自己想清楚再跟别人说。", "一个人在家过周末，让我觉得很充实。", "我很容易和陌生人聊起来。", "电话响起时，我会有点希望不用接。", "参加活动时，我喜欢同时和很多人交互。", "在会议或课堂上，我常是第一个发言的人。", "比起当面沟通，我更喜欢用文本消息。", "太久没有和人交互，我会觉得闷。", "常有人说“很难看出你在想什么”。", "我喜欢在热闹、有人走动的环境中工作。"], "SN": ["我比较相信亲身经验，而不是理论推测。", "我常会想像未来可能发生的各种情境。", "做事时，我习惯照着已经验证有效的方法。", "我容易被抽象概念或哲学问题吸引。", "我注意细节，常发现别人没注意到的地方。", "读书或看电影时，我更在意背后的象征和意义。", "描述事情时，我会说出具体的时间、地点和数字。", "我常有天马行空的点子，但不一定会去实行。", "我喜欢实用、能马上派上用场的知识。", "我常在不同事物之间看出别人没发现的关联。", "比起“可能会怎样”，我更关心“现在是怎样”。", "一成不变的例行工作，很快会让我失去耐心。", "学新东西时，我喜欢先看实际范例，再理解原理。", "我常会想“如果……会怎样？”", "别人常说我是脚踏实地、务实的人。"], "TF": ["做决定时，我优先考虑逻辑和客观事实。", "我很容易察觉别人的情绪变化。", "我认为直接指出问题，比顾及对方感受更重要。", "看到别人难过时，我也会跟着难受。", "争论时，我在意的是谁的论点比较正确。", "做决定时，我会先考虑这对身边的人有什么影响。", "别人说我有时太理性、不够体贴。", "维持团体和谐，对我来说很重要。", "我觉得规则应该一视同仁，不该因人情而例外。", "我很难拒绝别人的请求。", "比起被喜欢，我更在意被认为有能力。", "给别人负面意见时，我会花很多心思斟酌用字。", "我喜欢分析问题的原因，找出最有效率的解法。", "我常依照内心的价值观和感觉来做选择。", "朋友找我倾诉时，我的第一反应是帮他想办法解决。"], "JP": ["我喜欢事先把行程规划好。", "我常在截止日前才开始全力冲刺。", "我的桌面和房间通常井然有序。", "旅行时，我喜欢随兴走，不排太满的行程。", "事情有明确结论后，我才会觉得安心。", "计划临时改变时，我通常能很快适应。", "我习惯列待办清单，并一项项完成。", "我喜欢保留选择空间，不想太早做决定。", "我会先把工作做完，再去玩。", "我常同时开始好几件事，但不一定都完成。", "守时对我来说很重要。", "规则和流程常让我觉得被绑住。", "做了决定之后，我很少再反复更改。", "我觉得在压力下临场发挥，反而效率更好。", "我会提前准备，避免最后一刻手忙脚乱。"]}, "groups": {"NT": "理性分析型", "NF": "价值理想型", "SJ": "稳健守护型", "SP": "灵活探索型"}, "types": {"INTJ": ["远见策略家", "独立、理性，擅长看见长远的全局并规划步骤。对自己和他人的标准都高，喜欢把复杂问题变成有系统的方案。", ["能看见长期趋势并拟定策略", "独立思考，不轻易随波逐流", "学习新领域的速度快", "对目标有高度决心"], ["容易显得冷淡或不好亲近", "对效率低落的人事缺乏耐心", "可能低估情绪在决策中的份量"], "喜欢自主度高、能深入钻研的工作，讨厌没有意义的会议与繁文缛节。", ["策略规划", "系统架构", "研究员", "数据分析", "产品经理"], "重视少数深交，表达关心的方式常是“帮你解决问题”。需要对方理解他的独处需求。", ["提出结论前，先问问别人的感受与想法", "接受“够好”有时比“完美”更有价值", "练习把思考过程说出来，让别人跟得上"]], "INTP": ["原理探究者", "好奇心旺盛，喜欢拆解事物背后的原理。思考弹性大，享受理论与点子本身带来的乐趣。", ["分析力强，能抓出逻辑漏洞", "思想开放，愿意接受新观点", "擅长抽象思考与创建模型", "面对问题冷静客观"], ["常停在思考阶段，不容易落实", "容易疏忽日常琐事与细节", "有时忽略他人情绪，说话太直"], "适合需要解决复杂问题、允许自由探索的环境。", ["编程", "科学研究", "学术工作", "工程师", "游戏设计"], "对亲近的人很忠诚，但不擅长主动表达情感；喜欢能和他一起天马行空讨论的人。", ["替点子设置期限和第一步行动", "练习用对方听得懂的方式说明", "定期整理生活上的待办事项"]], "ENTJ": ["目标推动者", "果断、有自信，倾向带领团队朝目标前进。擅长组织资源、做出决策并推动运行。", ["决策迅速、敢于承担", "能把愿景转化为具体计划", "沟通直接、有说服力", "高效率、重视成果"], ["容易显得强势或不耐烦", "可能忽略团队成员的情绪与步调", "不太容易承认自己的脆弱"], "在能主导、有明确目标与成长空间的环境中发挥最好。", ["管理职", "创业", "项目经理", "顾问", "律师"], "对关系同样投入，会规划共同的未来；需要学会在亲密关系中放下“管理者”的角色。", ["决策前多听一轮不同的意见", "肯定别人的努力，而不只是成果", "留时间休息，不把每件事都当成任务"]], "ENTP": ["点子激荡者", "反应快、爱挑战，喜欢从不同角度切入问题。讨论和辩论对他来说是一种乐趣，常带来新鲜的想法。", ["创意多、思考灵活", "口才好，能快速抓到重点", "不怕挑战传统做法", "适应力强，面对变化不慌乱"], ["容易三分钟热度，难以坚持到完成", "辩论过头可能让人觉得不被尊重", "对例行性工作缺乏耐心"], "适合变化多、能提案与创新的工作。", ["行销企划", "创业", "媒体记者", "顾问", "产品开发"], "有趣、充满惊喜，喜欢能互相激荡的对象；要留意别把争论带进感情。", ["挑一个点子，坚持做到完成", "争论前先确认对方是否想讨论", "把运行细节交给擅长的伙伴，并尊重他们"]], "INFJ": ["洞察引导者", "安静而有深度，擅长理解他人内心，怀抱让世界更好的理想。外表温和，内心有坚定的原则。", ["洞察力强，能读懂言外之意", "有理想、有原则", "善于倾听与给予建议", "能长期投入有意义的目标"], ["容易承担太多他人的情绪而累垮", "对自己要求高，追求完美", "被误解时倾向默默切断关系"], "适合能帮助他人、符合个人价值观的工作。", ["咨商辅导", "教育", "社工", "写作", "人才发展"], "渴望深刻、真诚的链接，不喜欢表面社交；需要对方理解他偶尔需要独处。", ["学会说“不”，保留自己的能量", "把期待说出口，不要等别人猜", "允许计划和人都有不完美"]], "INFP": ["理想追寻者", "温柔、富有想像力，重视真实的自我与内心的价值。对美好事物敏感，常通过创作或关怀表达自己。", ["同理心强，包容不同的人", "创意与想像力丰富", "忠于自己的价值观", "擅长用文本或艺术表达情感"], ["容易理想化，遇到落差时感到失落", "面对冲突倾向逃避", "不擅长安排实际事务与时间"], "适合有意义、能发挥创意且弹性较大的工作。", ["设计", "写作编辑", "心理相关", "插画艺术", "非营利组织"], "浪漫、真诚，对感情投入很深；需要被接纳真实的样子。", ["把大梦想拆成今天能完成的小步骤", "练习及早表达不满，不要累积", "对自己温柔一点，别太苛责"]], "ENFJ": ["热忱带领者", "有感染力、乐于助人，擅长凝聚大家并激发他人的潜能。很在意团体的和谐与每个人的成长。", ["沟通与鼓舞人心的能力强", "善于察觉团队需求", "有责任感、组织力好", "真心希望他人变得更好"], ["太在意别人的看法", "容易忽略自己的需要", "可能过度介入他人的选择"], "适合与人合作、能带领或培育他人的角色。", ["教师讲师", "人力资源", "公关", "组织管理", "业务主管"], "体贴、主动经营关系；要记得也让对方有机会照顾你。", ["每周留一段只属于自己的时间", "接受不是每个人都需要你的帮忙", "遇到批评时，先分辨是对事还是对人"]], "ENFP": ["灵感火花家", "热情、好奇，总能在生活中找到新的可能。善于和人创建链接，把能量和乐观带给身边的人。", ["热情、有感染力", "点子多、想像力丰富", "善于社交、容易交朋友", "能看见他人的优点"], ["兴趣多但容易分心", "不擅长细节与重复性工作", "情绪起伏可能比较大"], "喜欢有创意、能接触人、变化多的工作。", ["行销企划", "活动策划", "教育", "媒体创作", "创业"], "温暖热情，喜欢分享生活；需要对方给他探索的空间。", ["用清单或番茄钟帮自己专注", "答应之前先评估时间和精力", "热度退去时，回想当初的初衷"]], "ISTJ": ["可靠运行者", "踏实、负责，做事一步一脚印。重视规则与承诺，是团队中最让人放心的人。", ["负责任、说到做到", "注重细节、做事精确", "有条理、善于规划流程", "冷静稳定，面对压力不慌"], ["对改变和新方法较抗拒", "可能显得固执、不够变通", "不太擅长表达情绪"], "适合结构清楚、重视准确度的工作。", ["会计财务", "行政管理", "工程", "品质管理", "公务人员"], "用实际行动表达爱，忠诚可靠；可以试着多用言语表达关心。", ["试着用新方法完成一件小事", "先听完别人的想法再判断", "偶尔说出感谢与感受"]], "ISFJ": ["细心守护者", "温和、体贴，默默照顾身边的人。记得别人的小细节，重视传统与稳定。", ["细心体贴，观察入微", "可靠、有耐心", "务实，能把事情做得周到", "重视团队与家庭"], ["容易委屈自己、不好意思拒绝", "对变动感到不安", "付出不被看见时容易受伤"], "适合能照顾他人、步调稳定的工作。", ["护理医疗", "教育", "行政支持", "客户服务", "社工"], "温柔忠诚，会默默记得对方的喜好；自己也需要被看见与感谢。", ["练习直接说出自己的需求", "把“别人的期待”和“自己的责任”分开", "给新事物一点机会"]], "ESTJ": ["秩序管理者", "务实、有组织力，擅长创建规则和流程让事情顺利运作。直接坦率，重视效率与责任。", ["组织与运行力强", "做事有效率、重结果", "诚实直接、值得信赖", "能清楚分配任务"], ["对不同做法缺乏弹性", "说话可能太直，让人感到压力", "容易忽略情绪面的需求"], "适合需要管理、制度与明确成果的职位。", ["管理职", "营运", "财务", "法律", "军警"], "重视承诺与责任，会为家人打点一切；可以多保留一些弹性与浪漫。", ["决定前先问“还有其他做法吗？”", "给回馈时先肯定、再建议", "允许别人用自己的方式完成"]], "ESFJ": ["温暖协调者", "热心、合群，乐于照顾大家的需要。擅长营造和谐气氛，是团体里的黏着剂。", ["热心助人、善于照顾", "人际关系良好", "有责任感、可靠", "擅长协调与安排活动"], ["太在意别人的评价", "不容易接受批评", "可能为了和谐而压抑自己的意见"], "适合与人接触、分工明确的环境。", ["教育", "医护", "人力资源", "活动企划", "客户服务"], "体贴周到，重视节日与仪式感；需要对方给予肯定与回应。", ["不必让每个人都满意", "把批评当成信息，而不是否定", "练习说出不同的意见"]], "ISTP": ["冷静工匠", "冷静、务实，喜欢动手了解事物如何运作。遇到突发状况反应快，擅长找出实际的解法。", ["冷静沉着、临危不乱", "动手与解决问题的能力强", "独立、有效率", "观察力敏锐"], ["不喜欢长期承诺与规划", "不擅长表达情感", "容易对无聊的事失去兴趣"], "适合能动手操作、自由度高的工作。", ["工程技术", "机械维修", "信息安全", "运动相关", "消防救护"], "给彼此空间，用行动陪伴；可以多分享一些内心的想法。", ["试着设置一个长期目标", "用简单的话说出自己的感受", "做决定前想想对他人的影响"]], "ISFP": ["自在创作者", "温和、敏感，活在当下并享受生活中的美感。不爱张扬，但有自己独特的品味与坚持。", ["审美敏锐、富有艺术感", "温柔包容、不批判他人", "活在当下、懂得享受", "适应力好"], ["不喜欢规划未来", "遇到冲突倾向退缩", "容易低估自己的能力"], "适合有创作空间、气氛和谐的工作。", ["设计", "摄影", "手作工艺", "美容美发", "动物照护"], "温柔体贴，用行动和小惊喜表达爱；需要被尊重、不被催促。", ["替重要的事加一点结构", "练习在冲突中表达立场", "让别人看   document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  render();}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)});

function render(){({intro,quiz,result})[S.view]();}

function intro(){
  const n=answered(),u=L.ui;
  app.innerHTML=`<section class="intro">
    <div class="eyebrow">${u.eyebrow}</div>
    <h1>${L.meta.title}</h1>
    <p class="lead">${u.lead}</p>
    <div class="facts">${u.facts.map(f=>`<span>${f}</span>`).join('')}</div>
    <div class="dims">${Object.keys(LET).map(k=>{const d=L.dims[k];return `<div class="dim"><div class="pair">${LET[k][0]} ${d.an} / ${LET[k][1]} ${d.bn}</div><div class="q">${d.q}</div></div>`}).join('')}</div>
    <div class="row">
      <button class="btn" id="go">${n?fmt(u.resume,{n}):u.start}</button>
      ${n?`<button class="btn ghost" id="reset">${u.restart}</button>`:''}
    </div>
    <p class="note">${u.disclaimer}</p>
  </section>`;
  document.getElementById('go').onclick=()=>{S.view=n===Q.length?'result':'quiz';save();render();scrollTo(0,0)};
  const r=document.getElementById('reset');if(r)r.onclick=reset;
}

function reset(){S={view:'quiz',page:0,ans:Array(Q.length).fill(null)};save();render();scrollTo(0,0);}

const VALS=[3,2,1,0,-1,-2,-3];
function quiz(){
  const u=L.ui,start=S.page*PER,items=Q.slice(start,start+PER);
  app.innerHTML=`<div class="bar"><div class="meta"><span>${fmt(u.pageOf,{p:S.page+1,n:PAGES})}</span><span id="cnt"></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="qlist">${items.map((q,k)=>{const i=start+k;return `<div class="qi${S.ans[i]!==null?' done':''}" id="q${i}">
    <p class="text"><span class="num">${i+1}</span>${L.q[q.d][q.i]}</p>
    <div class="scale"><span class="lab a">${u.agree}</span>
      <div class="dots" role="radiogroup" aria-label="${fmt(u.qLabel,{n:i+1})}">${VALS.map(v=>{const c=v>0?'ag':v<0?'di':'ne';return `<button class="dot s${Math.abs(v)} ${c}${S.ans[i]===v?' on':''}" role="radio" aria-checked="${S.ans[i]===v}" aria-label="${u.likert[3-v]}" data-i="${i}" data-v="${v}"></button>`}).join('')}</div>
      <span class="lab d">${u.disagree}</span></div></div>`}).join('')}</div>
  <div class="nav"><button class="btn ghost" id="prev">${S.page?u.prev:u.home}</button><button class="btn" id="next">${S.page===PAGES-1?u.see:u.next}</button></div>
  <p class="note" style="margin-top:12px;text-align:center">${u.neutralHint}</p>`;
  const upd=()=>{const n=answered();document.getElementById('cnt').textContent=fmt(u.done,{n,t:Q.length});document.getElementById('fill').style.width=(n/Q.length*100)+'%';
    document.getElementById('next').disabled=items.some((_,k)=>S.ans[start+k]===null);};
  upd();
  app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,v=+b.dataset.v,first=S.ans[i]===null;S.ans[i]=v;save();
    const box=document.getElementById('q'+i);box.classList.add('done');
    box.querySelectorAll('.dot').forEach(d=>{const on=+d.dataset.v===v;d.classList.toggle('on',on);d.setAttribute('aria-checked',on)});
    upd();
    if(first){for(let j=i+1;j<start+items.length;j++){if(S.ans[j]===null){const el=document.getElementById('q'+j);const y=el.getBoundingClientRect().top+scrollY-110;scrollTo({top:y,behavior:reduce?'auto':'smooth'});break;}}}
  });
  document.getElementById('prev').onclick=()=>{if(S.page)S.page--;else S.view='intro';save();render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{if(S.page<PAGES-1){S.page++;}else{S.view='result';}save();render();scrollTo(0,0)};
}

function score(){
  const out={};
  for(const d in LET){let s=0;Q.forEach((q,i)=>{if(q.d===d)s+=(S.ans[i]||0)*q.dir});
    const pa=Math.round(50+s/45*50);out[d]={pa,pb:100-pa,win:pa>=50?LET[d][0]:LET[d][1]};}
  return out;
}
const level=p=>{const x=Math.abs(p-50);return L.ui.levels[x<10?0:x<25?1:x<40?2:3]};
function group(code){return code[1]==='N'?(code[2]==='T'?'NT':'NF'):(code[3]==='J'?'SJ':'SP');}

function result(){
  const u=L.ui,sc=score(),code=Object.keys(LET).map(d=>sc[d].win).join(''),t=L.types[code],g=group(code),sep=L.meta.sep,co=L.meta.colon;
  app.style.setProperty('--grp',`var(${GVAR[g]})`);
  const meters=Object.keys(LET).map(k=>{const d=L.dims[k],[A,B]=LET[k],r=sc[k],aw=r.win===A;const p=aw?r.pa:r.pb;
    const fill=aw?`right:50%;width:${p-50}%`:`left:50%;width:${p-50}%`;
    return `<div class="meter"><div class="top2"><span class="${aw?'win':''}"><b>${A}</b> ${d.an} ${r.pa}%</span><span style="color:var(--muted)">${level(p)}</span><span class="${aw?'':'win'}">${r.pb}% ${d.bn} <b>${B}</b></span></div>
    <div class="mtrack"><div class="mfill" style="${fill}"></div><div class="mid"></div></div>
    <p class="desc">${aw?d.ad:d.bd}${Math.abs(p-50)<10?' '+u.close:''}</p></div>`}).join('');
  app.innerHTML=`<section class="hero">
    <span class="chip">${L.groups[g]}</span>
    <div class="code">${code}</div>
    <h1>${t[0]}</h1>
    <p class="sum">${t[1]}</p></section>
  <section class="sec"><h2>${u.secScores}</h2>${meters}</section>
  <section class="sec"><div class="cols">
    <div><p class="h3">${u.strengths}</p><ul class="list">${t[2].map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div><p class="h3">${u.blind}</p><ul class="list">${t[3].map(x=>`<li>${x}</li>`).join('')}</ul></div></div></section>
  <section class="sec"><h2>${u.work}</h2><p>${t[4]}</p><div class="tags">${t[5].map(x=>`<span class="tag">${x}</span>`).join('')}</div>
    <p class="note">${u.careerNote}</p></section>
  <section class="sec"><h2>${u.rel}</h2><p>${t[6]}</p></section>
  <section class="sec"><h2>${u.growth}</h2><ul class="list">${t[7].map(x=>`<li>${x}</li>`).join('')}</ul></section>
  <section class="sec"><h2>${u.cardH}</h2><p class="note">${u.cardNote}</p><div class="card"><img id="cardimg" alt="${code} ${t[0]} ${u.cardAlt}"></div></section>
  <section class="sec"><h2>${u.textH}</h2><p class="note">${u.textNote}</p>
    <textarea id="txt" readonly></textarea>
    <div class="row"><button class="btn" id="copy">${u.copy}</button><button class="btn ghost" id="redo">${u.redo}</button><button class="btn ghost" id="edit">${u.edit}</button></div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <p class="note">${u.finalNote}</p></section>`;
  const txt=`${u.txtTitle}\n${u.txtType}${co}${code} | ${t[0]} (${L.groups[g]})\n${t[1]}\n\n${u.txtScores}${co}\n`+
    Object.keys(LET).map(k=>`- ${LET[k][0]} ${L.dims[k].an} ${sc[k].pa}% / ${LET[k][1]} ${L.dims[k].bn} ${sc[k].pb}%`).join('\n')+
    `\n\n${u.txtStr}${co}${t[2].join(sep)}\n${u.txtBlind}${co}${t[3].join(sep)}\n${u.txtWork}${co}${t[4]}\n${u.txtCareer}${co}${t[5].join(sep)}\n${u.txtRel}${co}${t[6]}\n${u.txtGrowth}${co}\n${t[7].map((x,i)=>`${i+1}. ${x}`).join('\n')}`;
  const ta=document.getElementById('txt');ta.value=txt;
  document.getElementById('copy').onclick=()=>{const toast=document.getElementById('toast');
    navigator.clipboard.writeText(txt).then(()=>toast.textContent=u.copied).catch(()=>{ta.focus();ta.select();toast.textContent=u.selected});};
  document.getElementById('redo').onclick=reset;
  const forLang=lang;
  makeCard(code,t,g,sc).then(url=>{const im=document.getElementById('cardimg');if(im&&forLang===lang)im.src=url}).catch(()=>{});
  document.getElementById('edit').onclick=()=>{S.view='quiz';S.page=0;save();render();scrollTo(0,0)};
}

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function wrapText(x,text,maxW,en){const lines=[];let cur='';
  if(en){for(const w of text.split(' ')){const tryS=cur?cur+' '+w:w;if(cur&&x.measureText(tryS).width>maxW){lines.push(cur);cur=w;}else cur=tryS;}}
  else{const P='，。、；：！？）」』”';for(const ch of text){if(cur&&!P.includes(ch)&&x.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}}
  if(cur)lines.push(cur);return lines;}
async function makeCard(code,t,g,sc){
  const W=1080,H=1350,pad=80,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement),DISP=cs.getPropertyValue('--f-display').trim(),BODY=cs.getPropertyValue('--f-body').trim(),CODE='"Space Grotesk",sans-serif';
  const en=lang==='en',u=L.ui;
  try{await Promise.all(['700 72px '+DISP,'700 220px '+CODE,'400 32px '+BODY,'500 28px '+BODY,'700 30px '+BODY].map(f=>document.fonts.load(f,t[0]+t[1]+L.meta.title+'ABCDEFGHIJ0123')));}catch(e){}
  const col={NT:'#6a4c93',NF:'#2f8f6b',SJ:'#2f6fa8',SP:'#c27f12'}[g],ink='#1a2130',muted='#5d6779';
  x.fillStyle='#f7f8fb';x.fillRect(0,0,W,H);
  x.globalAlpha=.08;x.fillStyle=col;x.beginPath();x.arc(W-40,150,320,0,Math.PI*2);x.fill();x.globalAlpha=1;
  x.fillStyle=col;x.fillRect(0,0,W,14);
  x.textBaseline='middle';
  x.font='500 30px '+BODY;x.fillStyle=muted;x.textAlign='left';x.fillText(L.meta.title,pad,104);
  x.font='700 28px '+BODY;const gw=x.measureText(L.groups[g]).width+44;rr(x,W-pad-gw,80,gw,50,25);x.strokeStyle=col;x.lineWidth=3;x.stroke();x.fillStyle=col;x.textAlign='center';x.fillText(L.groups[g],W-pad-gw/2,106);
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font='700 220px '+CODE;x.fillStyle=col;x.fillText(code,pad-8,360);
  let ns=en?64:72;x.font='700 '+ns+'px '+DISP;while(x.measureText(t[0]).width>W-pad*2&&ns>40){ns-=4;x.font='700 '+ns+'px '+DISP;}
  x.fillStyle=ink;x.fillText(t[0],pad,478);
  let fs=en?30:32,lines;do{x.font='400 '+fs+'px '+BODY;lines=wrapText(x,t[1],W-pad*2,en);if(lines.length<=3)break;fs-=2;}while(fs>22);
  x.fillStyle=muted;lines.slice(0,3).forEach((l,i)=>x.fillText(l,pad,552+i*Math.round(fs*1.6)));
  x.fillStyle='#dde2ea';x.fillRect(pad,680,W-pad*2,2);
  let y=738;const bw=W-pad*2;
  for(const k of Object.keys(LET)){const d=L.dims[k],[A,B]=LET[k],r=sc[k],aw=r.win===A,p=aw?r.pa:r.pb;
    x.font=(aw?'700 ':'400 ')+'30px '+BODY;x.fillStyle=aw?col:muted;x.textAlign='left';x.fillText(A+' '+d.an+' '+r.pa+'%',pad,y);
    x.font=(aw?'400 ':'700 ')+'30px '+BODY;x.fillStyle=aw?muted:col;x.textAlign='right';x.fillText(r.pb+'% '+d.bn+' '+B,W-pad,y);
    x.font='400 24px '+BODY;x.fillStyle=muted;x.textAlign='center';x.fillText(level(p),W/2,y);
    rr(x,pad,y+18,bw,16,8);x.fillStyle='#e3e7ee';x.fill();
    const fw=(p-50)/100*bw;x.fillStyle=col;if(fw>0){if(aw)x.fillRect(W/2-fw,y+18,fw,16);else x.fillRect(W/2,y+18,fw,16);}
    x.fillStyle='#f7f8fb';x.fillRect(W/2-2,y+12,4,28);y+=88;}
  x.textAlign='left';x.font='700 30px '+DISP;x.fillStyle=ink;x.fillText(u.strengths,pad,1098);
  let tf=28,place;
  const layout=()=>{x.font='500 '+tf+'px '+BODY;const out=[];let tx=pad,ty=1124,rows=1;const h=tf+26;
    for(const s of t[2]){const w=x.measureText(s).width+40;if(tx+w>W-pad){tx=pad;ty+=h+16;rows++;}out.push([s,tx,ty,w,h]);tx+=w+14;}return [out,rows];};
  let rows;do{[place,rows]=layout();if(rows<=2)break;tf-=2;}while(tf>20);
  for(const [s,tx,ty,w,h] of place){rr(x,tx,ty,w,h,10);x.fillStyle=col+'1f';x.fill();x.fillStyle=col;x.textBaseline='middle';x.fillText(s,tx+20,ty+h/2+1);x.textBaseline='alphabetic';}
  x.font='400 22px '+BODY;x.fillStyle=muted;x.textAlign='center';x.fillText(u.cardFooter,W/2,H-40);
  return c.toDataURL('image/png');
}
setLang(lang);
</script>
