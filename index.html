  const r={};FN8.forEach(f=>r[f]=0);
  for(const id of DEF.order2){const it=DEF.items[id],a=S.ans[id];if(a==null||it.k==='C')continue;
    if(it.k==='L')r[it.f]+=a;else{const ch=a==='A'?it.fa:it.fb,ot=a==='A'?it.fb:it.fa;r[ch]+=3;r[ot]-=3;}}
  FN8.forEach(f=>r[f]=Math.round((r[f]+15)/30*100));return r;
}
function fnFit(fs){
  const u=FN8.map(f=>fs[f]),mu=u.reduce((a,b)=>a+b)/8;
  return Object.keys(STACK).map(t=>{const w=FN8.map(f=>{const i=STACK[t].indexOf(f);return i<0?0:4-i}),mw=10/8;let n=0,du=0,dw=0;
    for(let i=0;i<8;i++){n+=(u[i]-mu)*(w[i]-mw);du+=(u[i]-mu)**2;dw+=(w[i]-mw)**2;}
    return [t,Math.round(((du?n/Math.sqrt(du*dw):0)+1)*50)];}).sort((a,b)=>b[1]-a[1]);
}
function qc(){
  const pairs=[];
  for(const p of [1,2]){if(p===2&&!doneP(2))continue;
    for(const id of ORD(p)){const it=DEF.items[id];if(it.k!=='C')continue;const a=S.ans[id],b=S.ans[it.pair];if(a==null||b==null)continue;pairs.push({id,pair:it.pair,bad:Math.abs(a+b)>=4});}}
  let pos=0,neu=0,n=0;
  for(const id of DEF.order1){const it=DEF.items[id],a=S.ans[id];if(it.k!=='L'||a==null)continue;n++;if(a>0)pos++;if(a===0)neu++;}
  return {pairs,agree:n>0&&pos/n>0.75,neutral:n>0&&neu/n>0.3};
}

function fnMeasured(code){
  const u=L.ui;
  if(!doneP(2)){const n=nAns(2);return `<p class="note">${u.fnDisclaimer}</p><div class="cta"><p class="h3">${u.p2Title}</p><p class="note">${u.p2Intro}</p><div class="row"><button class="btn" id="p2go">${n?fmt(u.p2Resume,{n}):u.p2Start}</button></div></div>`;}
  const fs=fnScore(),fit=fnFit(fs).sort((a,b)=>b[1]-a[1]||(b[0]===code)-(a[0]===code)),st=STACK[code];
  const rows=FN8.slice().sort((a,b)=>fs[b]-fs[a]).map(f=>{const i=st.indexOf(f);return `<div class="fbar"><span class="fl"><b>${f}</b>${L.fns[f][0]}${i>=0?`<span class="rt">${u.roles[i]}</span>`:''}</span><span class="ft"><span style="width:${fs[f]}%;background:${FCOL[f[0]]}"></span></span><span class="fv">${fs[f]}</span></div>`}).join('');
  const mine=fit.find(x=>x[0]===code)[1],rank=fit.filter(x=>x[1]>mine).length+1,best=fit[0][0];
  const msg=rank===1?u.fitSame:rank<=3?fmt(u.fitTop3,{type:code,n:rank,best}):fmt(u.fitDiff,{type:code,best});
  return `<p class="h3">${u.fnMeasuredH}</p><p class="note">${fmt(u.fnMeasuredNote,{type:code})}</p><div class="fbars">${rows}</div>
    <p class="h3">${u.fitH}</p><p class="note">${u.fitNote}</p>
    <div class="fits">${fit.slice(0,3).map(([t,m])=>`<div class="fit${t===code?' me':''}"><b>${t}</b><span>${L.types[t][0]}</span><span class="m">${u.match} ${m}%</span></div>`).join('')}</div>
    <p>${msg}</p><div class="row"><button class="btn ghost" id="p2edit">${u.p2Edit}</button></div>`;
}
const flip=f=>f[0]+(f[1]==='i'?'e':'i');
function deepHTML(code){
  const u=L.ui,D=L.deep,co=L.meta.colon,st=STACK[code],all=st.concat(st.map(flip)),[dom,aux,ter,inf]=st;
  const row=(f,i)=>`<li><span class="sw" style="background:${FCOL[f[0]]}"></span><span class="ttl"><span class="role">${i+1}. ${D.posNames[i]}</span><b>${f}</b>${L.fns[f][0]}</span><span class="d">${D.posDesc[i]}</span></li>`;
  let flag='';if(doneP(2)){const fs=fnScore();if(fs[ter]>fs[aux])flag=`<p class="note">${fmt(u.loopFlag,{ter,aux})}</p>`;}
  return `<section class="sec" id="deepsec"><h2>${u.deepH}</h2><p class="note">${u.deepNote}</p>
    <div class="sub first"><p class="h3">${u.posH}</p><p class="note">${u.posConscious}</p><ol class="fnlist">${all.slice(0,4).map(row).join('')}</ol>
      <details class="more"><summary>${u.posShadow}</summary><ol class="fnlist">${all.slice(4).map((f,i)=>row(f,i+4)).join('')}</ol></details></div>
    <div class="sub"><p class="h3">${u.healthH}</p><div class="hl">${st.map(f=>`<div class="hrow"><span class="hf"><b>${f}</b>${L.fns[f][0]}</span><span class="hg"><i>${u.healthy}</i>${D.health[f][0]}<small>${u.eg}${D.healthEx[f][0]}</small></span><span class="hb"><i>${u.unhealthy}</i>${D.health[f][1]}<small>${u.eg}${D.healthEx[f][1]}</small></span></div>`).join('')}</div></div>
    <div class="sub"><p class="h3">${u.loopH}${co}${dom}–${ter}</p><p>${fmt(dom[1]==='i'?u.loopI:u.loopE,{aux,dom,ter})}</p><p class="ex">${u.eg}${D.loopEx[code]}</p><p>${fmt(u.loopExit,{aux,hint:D.engage[aux]})}</p>${flag}</div>
    <div class="sub"><p class="h3">${u.gripH}${co}${inf}</p><p>${fmt(u.gripIntro,{inf})}</p><p>${D.grip[inf]}</p><p class="ex">${u.eg}${D.gripEx[inf]}</p><p>${fmt(u.gripExit,{dom})}</p></div>
    <div class="sub"><p class="h3">${u.demonH}${co}${all[7]}</p><p>${fmt(u.demonText,{f:all[7],name:L.fns[all[7]][0]})}</p><p class="ex">${u.eg}${D.demonEx[all[7]]}</p></div></section>`;
}
function qcHTML(q){
  const u=L.ui,n=q.pairs.length,bad=q.pairs.filter(p=>p.bad),k=bad.length,lv=k===0?'ok':k<=n/4?'warn':'bad';
  return `<section class="sec"><h2>${u.qcH}</h2><p class="note">${u.qcNote}</p>
    <p class="qcs ${lv}"><b>${fmt(u.qcScore,{ok:n-k,n})}</b></p><p>${lv==='ok'?u.qcGood:lv==='warn'?fmt(u.qcWarn,{k}):u.qcBad}</p>
    ${k?`<p class="h3">${u.qcPair}</p><ul class="list">${bad.map(p=>`<li>${L.items[p.pair]}<br><span class="note">↔ ${L.items[p.id]}</span></li>`).join('')}</ul>`:''}
    ${q.agree?`<p class="note">${u.styleAgree}</p>`:''}${q.neutral?`<p class="note">${u.styleNeutral}</p>`:''}</section>`;
}

const TABS=['over','life','fn','deep','share'];
function result(){
  const u=L.ui,sc=score(),code=Object.keys(LET).map(d=>sc[d].win).join(''),t=L.types[code],g=group(code),sep=L.meta.sep,co=L.meta.colon,q=qc();
  if(!TABS.includes(S.tab))S.tab='over';
  const tab=S.tab,ti=TABS.indexOf(tab);
  app.style.setProperty('--grp',`var(${GVAR[g]})`);
  const meters=Object.keys(LET).map(k=>{const d=L.dims[k],[A,B]=LET[k],r=sc[k],aw=r.win===A;const p=aw?r.pa:r.pb;
    const fill=aw?`right:50%;width:${p-50}%`:`left:50%;width:${p-50}%`;
    return `<div class="meter"><div class="top2"><span class="${aw?'win':''}"><b>${A}</b> ${d.an} ${r.pa}%</span><span style="color:var(--muted)">${level(p)}</span><span class="${aw?'':'win'}">${r.pb}% ${d.bn} <b>${B}</b></span></div>
    <div class="mtrack"><div class="mfill" style="${fill}"></div><div class="mid"></div></div>
    <p class="desc">${aw?d.ad:d.bd}${Math.abs(p-50)<10?' '+u.close:''}</p></div>`}).join('');
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  const panels={
    over:()=>`<section class="sec"><h2>${u.secScores}</h2>${meters}</section>
      <section class="sec"><div class="cols">
        <div><p class="h3">${u.strengths}</p><ul class="list">${li(t[2])}</ul></div>
        <div><p class="h3">${u.blind}</p><ul class="list">${li(t[3])}</ul></div></div></section>
      ${qcHTML(q)}`,
    life:()=>`<section class="sec"><h2>${u.work}</h2><p>${t[4]}</p><div class="tags">${t[5].map(x=>`<span class="tag">${x}</span>`).join('')}</div>
        <p class="note">${u.careerNote}</p></section>
      <section class="sec"><h2>${u.rel}</h2><p>${t[6]}</p></section>
      <section class="sec"><h2>${u.growth}</h2><ol class="list steps">${li(t[7])}</ol></section>`,
    fn:()=>`<section class="sec" id="fnsec"><h2>${u.fnH}</h2><p class="note">${u.fnNote}</p>
      <div class="fnwrap">${fnSVG(code,L)}</div>
      <ol class="fnlist">${STACK[code].map((f,i)=>`<li><span class="sw" style="background:${FCOL[f[0]]}"></span><span class="ttl"><span class="role">${i+1}. ${u.roles[i]}</span><b>${f}</b>${L.fns[f][0]}</span><span class="d">${L.fns[f][1]} ${u.roleDesc[i]}</span></li>`).join('')}</ol>
      <div class="sub">${fnMeasured(code)}</div></section>`,
    deep:()=>deepHTML(code),
    share:()=>`<section class="sec"><h2>${u.cardH}</h2><p class="note">${u.cardNote}</p><div class="card"><img id="cardimg" alt="${code} ${t[0]} ${u.cardAlt}"></div></section>
      <section class="sec"><h2>${u.textH}</h2><p class="note">${u.textNote}</p>
        <textarea id="txt" readonly></textarea>
        <div class="row"><button class="btn" id="copy">${u.copy}</button></div>
        <p class="toast" id="toast" aria-live="polite"></p></section>
      <section class="sec"><div class="row"><button class="btn ghost" id="redo">${u.redo}</button><button class="btn ghost" id="edit">${u.edit}</button></div>
        <p class="note">${u.finalNote}</p></section>`
  };
  app.innerHTML=`<section class="hero${tab==='over'?'':' compact'}">
    <span class="chip">${L.groups[g]}</span>
    <div class="code">${code}</div>
    <h1>${t[0]}</h1>
    <p class="sum">${t[1]}</p></section>
  <nav class="tabs" role="tablist" aria-label="${u.tabsLabel}">${TABS.map(k=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${u.tabs[k]}</button>`).join('')}</nav>
  <div id="panel" role="tabpanel">${panels[tab]()}</div>
  <div class="pager">${ti>0?`<button class="btn ghost" data-tab="${TABS[ti-1]}">← ${u.tabs[TABS[ti-1]]}</button>`:'<span></span>'}${ti<TABS.length-1?`<button class="btn" data-tab="${TABS[ti+1]}">${fmt(u.nextPart,{name:u.tabs[TABS[ti+1]]})} →</button>`:''}</div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab===S.tab)return;S.tab=b.dataset.tab;save();render();scrollTo(0,0);});
  const cur=app.querySelector('.tabs [aria-selected="true"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
  const $=id=>document.getElementById(id);
  if($('txt')){
    const nb=q.pairs.filter(p=>p.bad).length;
    let txt=`${u.txtTitle}\n${u.txtType}${co}${code} | ${t[0]} (${L.groups[g]})\n${t[1]}\n\n${u.txtScores}${co}\n`+
      Object.keys(LET).map(k=>`- ${LET[k][0]} ${L.dims[k].an} ${sc[k].pa}% / ${LET[k][1]} ${L.dims[k].bn} ${sc[k].pb}%`).join('\n')+
      `\n\n${u.fnH}${co}${STACK[code].join(' > ')}`;
    if(doneP(2)){const fs=fnScore(),fit=fnFit(fs);txt+=`\n${u.fnMeasuredH}${co}${FN8.slice().sort((a,b)=>fs[b]-fs[a]).map(f=>f+' '+fs[f]).join(sep)}\n${u.txtFit}${co}${fit.slice(0,3).map(x=>x[0]+' '+x[1]+'%').join(sep)}`;}
    txt+=`\n${u.txtQc}${co}${fmt(u.qcScore,{ok:q.pairs.length-nb,n:q.pairs.length})}`+
      `\n\n${u.txtStr}${co}${t[2].join(sep)}\n${u.txtBlind}${co}${t[3].join(sep)}\n${u.txtWork}${co}${t[4]}\n${u.txtCareer}${co}${t[5].join(sep)}\n${u.txtRel}${co}${t[6]}\n${u.txtGrowth}${co}\n${t[7].map((x,i)=>`${i+1}. ${x}`).join('\n')}`;
    const ta=$('txt');ta.value=txt;
    $('copy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>$('toast').textContent=u.copied).catch(()=>{ta.focus();ta.select();$('toast').textContent=u.selected});};
    $('redo').onclick=reset;
    $('edit').onclick=()=>go('quiz',1,0);
    const forLang=lang;
    makeCard(code,t,g,sc).then(url=>{const im=$('cardimg');if(im&&forLang===lang)im.src=url}).catch(()=>{});
  }
  if($('p2go'))$('p2go').onclick=()=>go('quiz',2,firstOpen(2));
  if($('p2edit'))$('p2edit').onclick=()=>go('quiz',2,0);
}

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function wrapText(x,text,maxW,en){const lines=[];let cur='';
  if(en){for(const w of text.split(' ')){const tryS=cur?cur+' '+w:w;if(cur&&x.measureText(tryS).width>maxW){lines.push(cur);cur=w;}else cur=tryS;}}
  else{const P='，。、；：！？）」』”';for(const ch of text){if(cur&&!P.includes(ch)&&x.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}}
  if(cur)lines.push(cur);return lines;}
async function makeCard(code,t,g,sc){
  const W=1080,H=1350,pad=80,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement),DISP=cs.getPropertyValue('--f-display').trim(),BODY=cs.getPropertyValue('--f-body').trim(),CODE='"Space Grotesk",sans-serif';
  const en=lang==='en',u=L.ui;
  try{await Promise.all(['700 72px '+DISP,'700 220px '+CODE,'400 32px '+BODY,'500 28px '+BODY,'700 30px '+BODY].map(f=>document.fonts.load(f,t[0]+t[1]+L.meta.title+'ABCDEFGHIJ0123')));}catch(e){}
  const col={NT:'#6a4c93',NF:'#2f8f6b',SJ:'#2f6fa8',SP:'#c27f12'}[g],ink='#1a2130',muted='#5d6779';
  x.fillStyle='#f7f8fb';x.fillRect(0,0,W,H);
  x.globalAlpha=.08;x.fillStyle=col;x.beginPath();x.arc(W-40,150,320,0,Math.PI*2);x.fill();x.globalAlpha=1;
  x.fillStyle=col;x.fillRect(0,0,W,14);
  x.textBaseline='middle';
  x.font='500 30px '+BODY;x.fillStyle=muted;x.textAlign='left';x.fillText(L.meta.title,pad,104);
  x.font='700 28px '+BODY;const gw=x.measureText(L.groups[g]).width+44;rr(x,W-pad-gw,80,gw,50,25);x.strokeStyle=col;x.lineWidth=3;x.stroke();x.fillStyle=col;x.textAlign='center';x.fillText(L.groups[g],W-pad-gw/2,106);
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font='700 220px '+CODE;x.fillStyle=col;x.fillText(code,pad-8,360);
  let ns=en?64:72;x.font='700 '+ns+'px '+DISP;while(x.measureText(t[0]).width>W-pad*2&&ns>40){ns-=4;x.font='700 '+ns+'px '+DISP;}
  x.fillStyle=ink;x.fillText(t[0],pad,478);
  let fs=en?30:32,lines;do{x.font='400 '+fs+'px '+BODY;lines=wrapText(x,t[1],W-pad*2,en);if(lines.length<=3)break;fs-=2;}while(fs>22);
  x.fillStyle=muted;lines.slice(0,3).forEach((l,i)=>x.fillText(l,pad,552+i*Math.round(fs*1.6)));
  x.fillStyle='#dde2ea';x.fillRect(pad,680,W-pad*2,2);
  let y=738;const bw=W-pad*2;
  for(const k of Object.keys(LET)){const d=L.dims[k],[A,B]=LET[k],r=sc[k],aw=r.win===A,p=aw?r.pa:r.pb;
    x.font=(aw?'700 ':'400 ')+'30px '+BODY;x.fillStyle=aw?col:muted;x.textAlign='left';x.fillText(A+' '+d.an+' '+r.pa+'%',pad,y);
    x.font=(aw?'400 ':'700 ')+'30px '+BODY;x.fillStyle=aw?muted:col;x.textAlign='right';x.fillText(r.pb+'% '+d.bn+' '+B,W-pad,y);
    x.font='400 24px '+BODY;x.fillStyle=muted;x.textAlign='center';x.fillText(level(p),W/2,y);
    rr(x,pad,y+18,bw,16,8);x.fillStyle='#e3e7ee';x.fill();
    const fw=(p-50)/100*bw;x.fillStyle=col;if(fw>0){if(aw)x.fillRect(W/2-fw,y+18,fw,16);else x.fillRect(W/2,y+18,fw,16);}
    x.fillStyle='#f7f8fb';x.fillRect(W/2-2,y+12,4,28);y+=88;}
  x.textAlign='left';x.font='700 30px '+DISP;x.fillStyle=ink;x.fillText(u.strengths,pad,1098);
  let tf=28,place;
  const layout=()=>{x.font='500 '+tf+'px '+BODY;const out=[];let tx=pad,ty=1124,rows=1;const h=tf+26;
    for(const s of t[2]){const w=x.measureText(s).width+40;if(tx+w>W-pad){tx=pad;ty+=h+16;rows++;}out.push([s,tx,ty,w,h]);tx+=w+14;}return [out,rows];};
  let rows;do{[place,rows]=layout();if(rows<=2)break;tf-=2;}while(tf>20);
  for(const [s,tx,ty,w,h] of place){rr(x,tx,ty,w,h,10);x.fillStyle=col+'1f';x.fill();x.fillStyle=col;x.textBaseline='middle';x.fillText(s,tx+20,ty+h/2+1);x.textBaseline='alphabetic';}
  x.font='400 22px '+BODY;x.fillStyle=muted;x.textAlign='center';x.fillText(u.cardFooter,W/2,H-40);
  return c.toDataURL('image/png');
}
