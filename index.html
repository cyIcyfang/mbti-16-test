<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="免費十六型人格測驗（繁中／简中／English），64 題約 10–15 分鐘，含情境題、一致性檢核、認知功能進階測驗與八功能位置分析。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>十六型人格測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: single centered reading column (max 720px); language switch on top, quiz pages of 10 statements, then a result report */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#1a2130; --muted:#5d6779; --line:#dde2ea;
  --accent:#2f5d8a; --accent-soft:#e3ecf5; --agree:#2f8f6b; --disagree:#8a5a9e;
  --nt:#6a4c93; --nf:#2f8f6b; --sj:#2f6fa8; --sp:#c27f12; --bad:#b3402e;
  --f-display:"LXGW WenKai TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-code:"Space Grotesk","Noto Sans TC",sans-serif;
}
:root[lang^="zh-Hans"]{--f-display:"Noto Serif SC","Noto Sans SC",serif;--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--f-code:"Space Grotesk","Noto Sans SC",sans-serif}
:root[lang="en"]{--f-display:"Space Grotesk","Inter",sans-serif;--f-body:"Inter","Helvetica Neue",Arial,sans-serif;--f-code:"Space Grotesk","Inter",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; --bad:#ee9080; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a202b; --fg:#e7ebf2; --muted:#9aa4b5; --line:#2c3443;
  --accent:#7fb0e0; --accent-soft:#1f2f42; --agree:#5cc49c; --disagree:#c193d4;
  --nt:#a98ad6; --nf:#5cc49c; --sj:#6fa8e0; --sp:#e5a845; --bad:#ee9080; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{display:flex;justify-content:flex-end;padding-top:16px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font-size:13px;font-weight:500;font-family:var(--f-body)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}

/* intro */
.intro{padding-block:24px 24px;display:grid;gap:20px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.intro h1{font-size:clamp(32px,7vw,48px)}
.intro .lead{color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-family:var(--f-code)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dim .pair{font-family:var(--f-code);font-weight:700;font-size:17px}
.dim .q{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:12px 24px;background:var(--accent);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:13px;color:var(--muted)}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.qlist{display:grid;gap:0;margin-top:8px}
.qi{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:16px;transition:opacity .2s}
.qi.done{opacity:.55}
.qi.done:hover,.qi.done:focus-within{opacity:1}
.qi .text{font-size:18px;font-weight:500;text-align:center}
.qi .num{font-family:var(--f-code);color:var(--muted);font-size:13px;margin-right:6px}
.scale{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.scale .lab{font-size:13px;font-weight:700;white-space:nowrap}
.lab.a{color:var(--agree)} .lab.d{color:var(--disagree)}
.dots{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dot{border-radius:50%;border:2px solid;background:transparent;padding:0;flex:none;transition:background .15s,transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.s3{width:44px;height:44px}.dot.s2{width:36px;height:36px}.dot.s1{width:29px;height:29px}.dot.s0{width:22px;height:22px}
.dot.ag{border-color:var(--agree)}.dot.ag.on{background:var(--agree)}
.dot.di{border-color:var(--disagree)}.dot.di.on{background:var(--disagree)}
.dot.ne{border-color:var(--muted)}.dot.ne.on{background:var(--muted)}
@media (max-width:460px){
  .scale{grid-template-columns:1fr 1fr;row-gap:8px}
  .dots{grid-column:1/-1;grid-row:1}
  .lab.d{text-align:right}
  .dot.s3{width:38px;height:38px}.dot.s2{width:32px;height:32px}.dot.s1{width:26px;height:26px}.dot.s0{width:20px;height:20px}
}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}

/* result */
.hero{padding-block:28px 28px;display:grid;gap:10px;text-align:center;justify-items:center}
.code{font-family:var(--f-code);font-weight:700;font-size:clamp(56px,16vw,96px);letter-spacing:.06em;line-height:1;color:var(--grp)}
.hero h1{font-size:clamp(26px,6vw,36px)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;color:var(--grp);border:1px solid var(--grp)}
.hero .sum{max-width:56ch;color:var(--muted)}
.sec{padding-block:24px;border-top:1px solid var(--line);display:grid;gap:14px}
.sec h2{font-size:22px}
.meter{display:grid;gap:6px}
.meter .top2{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.meter .top2 b{font-family:var(--f-code)}
.meter .top2 .win{color:var(--grp)}
.mtrack{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mfill{position:absolute;top:0;bottom:0;background:var(--grp)}
.mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bg)}
.meter .desc{font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.cols,.dims{grid-template-columns:1fr}}
ul.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:14px;padding:4px 12px;border-radius:6px;background:var(--accent-soft)}
.h3{font-size:17px;font-family:var(--f-display);font-weight:700}
.toast{font-size:14px;color:var(--agree);min-height:1.5em}
.fnwrap{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.fnwrap svg{display:block;width:100%;min-width:300px;height:auto}
.fnlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fnlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.fnlist .sw{grid-row:span 2;width:14px;height:14px;border-radius:50%;margin-top:6px;border:1px solid rgba(20,26,38,.4)}
.fnlist .ttl{font-weight:700}
.fnlist .ttl .role{color:var(--muted);font-weight:500;margin-right:8px}
.fnlist .ttl b{font-family:var(--f-code);margin-right:6px}
.fnlist .d{font-size:14px;color:var(--muted)}
.card img{display:block;width:100%;max-width:480px;margin:0 auto;border-radius:12px;border:1px solid var(--line);aspect-ratio:4/5;background:var(--surface)}
textarea{width:100%;min-height:160px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.5}
.opt .ol{font-family:var(--f-code);font-weight:700;color:var(--accent)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.cta{border:1px dashed var(--accent);border-radius:12px;padding:16px;display:grid;gap:10px}
.fbars{display:grid;gap:8px}
.fbar{display:grid;grid-template-columns:minmax(0,17em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px}
.fbar .fl b{font-family:var(--f-code);margin-right:6px}
.fbar .rt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.fbar .ft{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.fbar .ft span{display:block;height:100%}
.fbar .fv{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.fits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;background:var(--surface)}
.fit.me{border-color:var(--grp);border-width:2px}
.fit b{font-family:var(--f-code);font-size:20px}
.fit .m{font-size:13px;color:var(--muted)}
@media (max-width:560px){.fits{grid-template-columns:1fr}.fbar{grid-template-columns:minmax(0,1fr) 2.5em}.fbar .fl{grid-column:1/-1}}
.qcs{font-size:20px;font-family:var(--f-code)}
.qcs.ok{color:var(--agree)}.qcs.warn{color:var(--sp)}.qcs.bad{color:var(--bad)}
.hl{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) minmax(0,1fr);gap:6px 14px;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hrow .hf{font-weight:700}.hrow .hf b{font-family:var(--f-code);margin-right:6px}
.hrow i{display:block;font-style:normal;font-size:12px;font-weight:700}
.hg i{color:var(--agree)}.hb i{color:var(--bad)}
@media (max-width:560px){.hrow{grid-template-columns:1fr}}
.ex{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:15px}
.hrow small{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;font-family:var(--f-body)}
.tabs button[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
#panel>.sec:first-child{border-top:0}
.hero.compact{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;padding-block:16px 10px}
.hero.compact .code{font-size:32px}.hero.compact h1{font-size:20px}
.hero.compact .sum,.hero.compact .chip{display:none}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:20px;border-top:1px solid var(--line)}
.sec{padding-block:28px;gap:16px}
.sec>p,.sub>p{max-width:62ch}
.note{font-size:14px;line-height:1.65}
.h3{font-size:18px}
.meter{gap:8px}.meter+.meter{margin-top:8px}
.meter .desc,.fnlist .d{font-size:15px}
.sub{display:grid;gap:12px;padding-top:22px;margin-top:6px;border-top:1px dashed var(--line)}
.sub.first{border-top:0;padding-top:0;margin-top:0}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
details.more summary{cursor:pointer;font-weight:700;font-size:15px}
details.more[open] summary{margin-bottom:12px}
ol.steps{padding-left:1.4em;gap:10px}
ul.list,ol.list{gap:8px}
.hrow small{font-size:13.5px;line-height:1.6}
ol.list{margin:0;display:grid}
</style>

</head>

他人的情緒，重視和諧與人際連結。"]}, "dims": {"EI": {"an": "外向", "bn": "內向", "q": "你的能量從哪裡來？", "ad": "你從與人互動、參與外在活動中獲得能量，習慣邊說邊想、邊做邊調整。", "bd": "你從獨處與內在思考中恢復能量，習慣先想清楚再表達或行動。"}, "SN": {"an": "實感", "bn": "直覺", "q": "你如何接收資訊？", "ad": "你重視具體事實與親身經驗，關注當下與細節，偏好實用的做法。", "bd": "你重視整體模式與可能性，關注未來與意義，喜歡新點子和抽象概念。"}, "TF": {"an": "思考", "bn": "情感", "q": "你如何做決定？", "ad": "你做決定時以邏輯、客觀標準為主，重視公平與效率。", "bd": "你做決定時以價值觀與人的感受為主，重視和諧與體諒。"}, "JP": {"an": "判斷", "bn": "感知", "q": "你如何面對外在生活？", "ad": "你喜歡事先規劃、按部就班，事情有結論會讓你比較安心。", "bd": "你喜歡保留彈性、隨機應變，享受開放與探索的過程。"}}, "groups": {"NT": "理性分析型", "NF": "價值理想型", "SJ": "穩健守護型", "SP": "靈活探索型"}, "types": {"INTJ": ["遠見策略家", "獨立、理性，擅長看見長遠的全局並規劃步驟。對自己和他人的標準都高，喜歡把複雜問題變成有系統的方案。", ["能看見長期趨勢並擬定策略", "獨立思考，不輕易隨波逐流", "學習新領域的速度快", "對目標有高度決心"], ["容易顯得冷淡或不好親近", "對效率低落的人事缺乏耐心", "可能低估情緒在決策中的份量"], "喜歡自主度高、能深入鑽研的工作，討厭沒有意義的會議與繁文縟節。", ["策略規劃", "系統架構", "研究員", "數據分析", "產品經理"], "重視少數深交，表達關心的方式常是「幫你解決問題」。需要對方理解他的獨處需求。", ["提出結論前，先問問別人的感受與想法", "接受「夠好」有時比「完美」更有價值", "練習把思考過程說出來，讓別人跟得上"]], "INTP": ["原理探究者", "好奇心旺盛，喜歡拆解事物背後的原理。思考彈性大，享受理論與點子本身帶來的樂趣。", ["分析力強，能抓出邏輯漏洞", "思想開放，願意接受新觀點", "擅長抽象思考與建立模型", "面對問題冷靜客觀"], ["常停在思考階段，不容易落實", "容易疏忽日常瑣事與細節", "有時忽略他人情緒，說話太直"], "適合需要解決複雜問題、允許自由探索的環境。", ["程式設計", "科學研究", "學術工作", "工程師", "遊戲設計"], "對親近的人很忠誠，但不擅長主動表達情感；喜歡能和他一起天馬行空討論的人。", ["替點子設定期限和第一步行動", "練習用對方聽得懂的方式說明", "定期整理生活上的待辦事項"]], "ENTJ": ["目標推動者", "果斷、有自信，傾向帶領團隊朝目標前進。擅長組織資源、做出決策並推動執行。", ["決策迅速、敢於承擔", "能把願景轉化為具體計畫", "溝通直接、有說服力", "高效率、重視成果"], ["容易顯得強勢或不耐煩", "可能忽略團隊成員的情緒與步調", "不太容易承認自己的脆弱"], "在能主導、有明確目標與成長空間的環境中發揮最好。", ["管理職", "創業", "專案經理", "顧問", "律師"], "對關係同樣投入，會規劃共同的未來；需要學會在親密關係中放下「管理者」的角色。", ["決策前多聽一輪不同的意見", "肯定別人的努力，而不只是成果", "留時間休息，不把每件事都當成任務"]], "ENTP": ["點子激盪者", "反應快、愛挑戰，喜歡從不同角度切入問題。討論和辯論對他來說是一種樂趣，常帶來新鮮的想法。", ["創意多、思考靈活", "口才好，能快速抓到重點", "不怕挑戰傳統做法", "適應力強，面對變化不慌亂"], ["容易三分鐘熱度，難以堅持到完成", "辯論過頭可能讓人覺得不被尊重", "對例行性工作缺乏耐心"], "適合變化多、能提案與創新的工作。", ["行銷企劃", "創業", "媒體記者", "顧問", "產品開發"], "有趣、充滿驚喜，喜歡能互相激盪的對象；要留意別把爭論帶進感情。", ["挑一個點子，堅持做到完成", "爭論前先確認對方是否想討論", "把執行細節交給擅長的夥伴，並尊重他們"]], "INFJ": ["洞察引導者", "安靜而有深度，擅長理解他人內心，懷抱讓世界更好的理想。外表溫和，內心有堅定的原則。", ["洞察力強，能讀懂言外之意", "有理想、有原則", "善於傾聽與給予建議", "能長期投入有意義的目標"], ["容易承擔太多他人的情緒而累垮", "對自己要求高，追求完美", "被誤解時傾向默默切斷關係"], "適合能幫助他人、符合個人價值觀的工作。", ["諮商輔導", "教育", "社工", "寫作", "人才發展"], "渴望深刻、真誠的連結，不喜歡表面社交；需要對方理解他偶爾需要獨處。", ["學會說「不」，保留自己的能量", "把期待說出口，不要等別人猜", "允許計畫和人都有不完美"]], "INFP": ["理想追尋者", "溫柔、富有想像力，重視真實的自我與內心的價值。對美好事物敏感，常透過創作或關懷表達自己。", ["同理心強，包容不同的人", "創意與想像力豐富", "忠於自己的價值觀", "擅長用文字或藝術表達情感"], ["容易理想化，遇到落差時感到失落", "面對衝突傾向逃避", "不擅長安排實際事務與時間"], "適合有意義、能發揮創意且彈性較大的工作。", ["設計", "寫作編輯", "心理相關", "插畫藝術", "非營利組織"], "浪漫、真誠，對感情投入很深；需要被接納真實的樣子。", ["把大夢想拆成今天能完成的小步驟", "練習及早表達不滿，不要累積", "對自己溫柔一點，別太苛責"]], "ENFJ": ["熱忱帶領者", "有感染力、樂於助人，擅長凝聚大家並激發他人的潛能。很在意團體的和諧與每個人的成長。", ["溝通與鼓舞人心的能力強", "善於察覺團隊需求", "有責任感、組織力好", "真心希望他人變得更好"], ["太在意別人的看法", "容易忽略自己的需要", "可能過度介入他人的選擇"], "適合與人合作、能帶領或培育他人的角色。", ["教師講師", "人力資源", "公關", "組織管理", "業務主管"], "體貼、主動經營關係；要記得也讓對方有機會照顧你。", ["每週留一段只屬於自己的時間", "接受不是每個人都需要你的幫忙", "遇到批評時，先分辨是對事還是對人"]], "ENFP": ["靈感火花家", "熱情、好奇，總能在生活中找到新的可能。善於和人建立連結，把能量和樂觀帶給身邊的人。", ["熱情、有感染力", "點子多、想像力豐富", "善於社交、容易交朋友", "能看見他人的優點"], ["興趣多但容易分心", "不擅長細節與重複性工作", "情緒起伏可能比較大"], "喜歡有創意、能接觸人、變化多的工作。", ["行銷企劃", "活動策劃", "教育", "媒體創作", "創業"], "溫暖熱情，喜歡分享生活；需要對方給他探索的空間。", ["用清單或番茄鐘幫自己專注", "答應之前先評估時間和精力", "熱度退去時，回想當初的初衷"]], "ISTJ": ["可靠執行者", "踏實、負責，做事一步一腳印。重視規則與承諾，是團隊中最讓人放心的人。", ["負責任、說到做到", "注重細節、做事精確", "有條理、善於規劃流程", "冷靜穩定，面對壓力不慌"], ["對改變和新方法較抗拒", "可能顯得固執、不夠變通", "不太擅長表達情緒"], "適合結構清楚、重視準確度的工作。", ["會計財務", "行政管理", "工程", "品質管理", "公務人員"], "用實際行動表達愛，忠誠可靠；可以試著多用言語表達關心。", ["試著用新方法完成一件小事", "先聽完別人的想法再判斷", "偶爾說出感謝與感受"]], "ISFJ": ["細心守護者", "溫和、體貼，默默照顧身邊的人。記得別人的小細節，重視傳統與穩定。", ["細心體貼，觀察入微", "可靠、有耐心", "務實，能把事情做得周到", "重視團隊與家庭"], ["容易委屈自己、不好意思拒絕", "對變動感到不安", "付出不被看見時容易受傷"], "適合能照顧他人、步調穩定的工作。", ["護理醫療", "教育", "行政支援", "客戶服務", "社工"], "溫柔忠誠，會默默記得對方的喜好；自己也需要被看見與感謝。", ["練習直接說出自己的需求", "把「別人的期待」和「自己的責任」分開", "給新事物一點機會"]], "ESTJ": ["秩序管理者", "務實、有組織力，擅長建立規則和流程讓事情順利運作。直接坦率，重視效率與責任。", ["組織與執行力強", "做事有效率、重結果", "誠實直接、值得信賴", "能清楚分配任務"], ["對不同做法缺乏彈性", "說話可能太直，讓人感到壓力", "容易忽略情緒面的需求"], "適合需要管理、制度與明確成果的職位。", ["管理職", "營運", "財務", "法律", "軍警"], "重視承諾與責任，會為家人打點一切；可以多保留一些彈性與浪漫。", ["決定前先問「還有其他做法嗎？」", "給回饋時先肯定、再建議", "允許別人用自己的方式完成"]], "ESFJ": ["溫暖協調者", "熱心、合群，樂於照顧大家的需要。擅長營造和諧氣氛，是團體裡的黏著劑。", ["熱心助人、善於照顧", "人際關係良好", "有責任感、可靠", "擅長協調與安排活動"], ["太在意別人的評價", "不容易接受批評", "可能為了和諧而壓抑自己的意見"], "適合與人接觸、分工明確的環境。", ["教育", "醫護", "人力資源", "活動企劃", "客戶服務"], "體貼周到，重視節日與儀式感；需要對方給予肯定與回應。", ["不必讓每個人都滿意", "把批評當成資訊，而不是否定", "練習說出不同的意見"]], "ISTP": ["冷靜工匠", "冷靜、務實，喜歡動手了解事物如何運作。遇到突發狀況反應快，擅長找出實際的解法。", ["冷靜沉著、臨危不亂", "動手與解決問題的能力強", "獨立、有效率", "觀察力敏銳"], ["不喜歡長期承諾與規劃", "不擅長表達情感", "容易對無聊的事失去興趣"], "適合能動手操作、自由度高的工作。", ["工程技術", "機械維修", "資訊安全", "運動相關", "消防救護"], "給彼此空間，用行動陪伴；可以多分享一些內心的想法。", ["試著設定一個長期目標", "用簡單的話說出自己的感受", "做決定前想想對他人的影響"]], "ISFP": ["自在創作者", "溫和、敏感，活在當下並享受生活中的美感。不愛張揚，但有自己獨特的品味與堅持。", ["審美敏銳、富有藝術感", "溫柔包容、不批判他人", "活在當下、懂得享受", "適應力好"], ["不喜歡規劃未來", "遇到衝突傾向退縮", "容易低估自己的能力"], "適合有創作空間、氣氛和諧的工作。", ["設計", "攝影", "手作工藝", "美容美髮", "動物照護"], "溫柔體貼，用行動和小驚喜表達愛；需要被尊重、不被催促。", ["替重要的事加一點結構", "練習在衝突中表達立場", "讓別人看見你的作品和想法"]], "ESTP": ["行動實踐家", "精力充沛、反應快，喜歡從做中學。擅長觀察現場狀況，抓住機會立即行動。", ["行動力強、敢冒險", "臨場反應與談判能力好", "務實，重視實際效果", "幽默、善於社交"], ["容易衝動，忽略長期後果", "對理論與規劃缺乏耐心", "可能不經意說話傷人"], "適合節奏快、能直接看到成果的工作。", ["業務", "創業", "運動教練", "警消救護", "活動執行"], "有趣、愛冒險，帶來很多新鮮體驗；要留意對方是否需要更多穩定感。", ["重要決定前停一下，想想三個月後", "培養一項需要長期累積的技能", "說話前想想對方的感受"]], "ESFP": ["舞台活力家", "開朗、熱情，喜歡和人一起享受生活。天生有表演魅力，能讓周遭氣氛熱絡起來。", ["樂觀開朗、帶動氣氛", "善於觀察他人需求", "務實、懂得享受當下", "適應力強"], ["不喜歡長期規劃", "容易受情緒與誘惑影響", "面對嚴肅問題時傾向逃避"], "適合與人互動、有表現機會的工作。", ["表演藝術", "活動主持", "業務", "餐飲服務", "幼兒教育"], "熱情慷慨，喜歡一起體驗新事物；也要學著面對關係中的難題。", ["每月設定一個小儲蓄或學習目標", "遇到問題先處理，再放鬆", "給自己安靜反思的時間"]]}, "items": {"EI0": "在聚會中，我通常會主動認識新朋友。", "EI1": "和一大群人相處一整天後，我需要獨處來恢復精力。", "EI3": "比起大型聚會，我更喜歡和一兩位好友深聊。", "EI4": "在團體中，我常是帶動氣氛的人。", "EI5": "遇到問題時，我傾向先自己想清楚再跟別人說。", "EI6": "一個人在家過週末，讓我覺得很充實。", "EI7": "我很容易和陌生人聊起來。", "EI9": "參加活動時，我喜歡同時和很多人互動。", "EI11": "比起當面溝通，我更喜歡用文字訊息。", "EI12": "太久沒有和人互動，我會覺得悶。", "EI13": "常有人說「很難看出你在想什麼」。", "EI14": "我喜歡在熱鬧、有人走動的環境中工作。", "SN0": "我比較相信親身經驗，而不是理論推測。", "SN1": "我常會想像未來可能發生的各種情境。", "SN2": "做事時，我習慣照著已經驗證有效的方法。", "SN3": "我容易被抽象概念或哲學問題吸引。", "SN4": "我注意細節，常發現別人沒注意到的地方。", "SN5": "讀書或看電影時，我更在意背後的象徵和意義。", "SN6": "描述事情時，我會說出具體的時間、地點和數字。", "SN7": "我常有天馬行空的點子，但不一定會去實行。", "SN8": "我喜歡實用、能馬上派上用場的知識。", "SN9": "我常在不同事物之間看出別人沒發現的關聯。", "SN11": "一成不變的例行工作，很快會讓我失去耐心。", "SN14": "別人常說我是腳踏實地、務實的人。", "TF0": "做決定時，我優先考慮邏輯和客觀事實。", "TF1": "我很容易察覺別人的情緒變化。", "TF2": "我認為直接指出問題，比顧及對方感受更重要。", "TF3": "看到別人難過時，我也會跟著難受。", "TF4": "爭論時，我在意的是誰的論點比較正確。", "TF5": "做決定時，我會先考慮這對身邊的人有什麼影響。", "TF7": "維持團體和諧，對我來說很重要。", "TF8": "我覺得規則應該一視同仁，不該因人情而例外。", "TF10": "比起被喜歡，我更在意被認為有能力。", "TF11": "給別人負面意見時，我會花很多心思斟酌用字。", "TF12": "我喜歡分析問題的原因，找出最有效率的解法。", "TF13": "我常依照內心的價值觀和感覺來做選擇。", "JP0": "我喜歡事先把行程規劃好。", "JP1": "我常在截止日前才開始全力衝刺。", "JP2": "我的桌面和房間通常井然有序。", "JP3": "旅行時，我喜歡隨興走，不排太滿的行程。", "JP4": "事情有明確結論後，我才會覺得安心。", "JP5": "計畫臨時改變時，我通常能很快適應。", "JP6": "我習慣列待辦清單，並一項項完成。", "JP7": "我喜歡保留選擇空間，不想太早做決定。", "JP10": "守時對我來說很重要。", "JP11": "規則和流程常讓我覺得被綁住。", "JP13": "我覺得在壓力下臨場發揮，反而效率更好。", "JP14": "我會提前準備，避免最後一刻手忙腳亂。", "EIs1": ["忙了一整週，終於到了週五晚上，你比較想：", "約朋友出去吃飯聊天，熱鬧一下", "回家做自己的事，安靜充電"], "EIs2": ["小組討論一個新題目時，你通常：", "先在心裡想好，再說出比較完整的看法", "邊講邊想，在討論中把想法理出來"], "EIs3": ["參加一場大多是陌生人的活動，你比較可能：", "主動到處認識人，結束時多了不少新朋友", "找一兩個聊得來的人，好好聊到結束"], "SNs1": ["學一套新的軟體或工具時，你比較喜歡：", "跟著步驟實際操作一遍", "先弄懂整體架構和設計邏輯"], "SNs2": ["朋友向你介紹一個創業點子，你最先注意到的是：", "這個點子未來可以發展成什麼", "實際要怎麼執行、成本是多少"], "SNs3": ["逛完一個第一次去的展覽，你記得最清楚的通常是：", "作品的細節：顏色、材質、擺設方式", "整體給你的感覺，以及它讓你聯想到的事"], "TFs1": ["朋友找你訴苦，說工作上被主管責備。你的第一反應比較接近：", "先安撫情緒，讓他知道你懂他的感受", "幫他分析問題出在哪裡、接下來可以怎麼做"], "TFs2": ["你要在兩位組員中選一位負責重要任務，你比較看重：", "誰的能力最適合這個任務", "誰最需要這個機會，以及選了之後團隊的氣氛"], "TFs3": ["同事的提案有明顯的漏洞，在會議上你比較可能：", "直接指出問題，這樣對事情最有幫助", "先肯定優點，會後再私下提醒"], "JPs1": ["規劃一趟三天的旅行，你比較可能：", "先訂好每天的行程和餐廳", "只訂好住宿，其他到當地再看"], "JPs2": ["一份兩週後要交的報告，你通常：", "在最後幾天集中火力完成", "先排好進度，分幾天陸續完成"], "JPs3": ["週末突然多出一整天空檔，你比較想：", "看當下的心情，想到什麼做什麼", "列出想做的事，安排一下順序"], "EIc": "和不認識的人聊天，對我來說有點吃力。", "SNc": "討論抽象的理論，很快就讓我覺得無聊。", "TFc": "做決定時，我更常跟著感覺走，而不是分析利弊。", "JPc": "出門或旅行前，我通常不會先做規劃。", "Ni1": "我常在沒有明確理由的情況下，就對事情最後會怎麼發展有很強的預感。", "Ni2": "我習慣把許多線索收攏成一個核心的想法或方向。", "Ne1": "一個點子常會讓我接連想到更多點子，停不下來。", "Ne2": "我喜歡同時探索很多種可能，而不是太早鎖定一個答案。", "Si1": "我會拿現在的情況和過去的經驗比較，來判斷該怎麼做。", "Si2": "我對熟悉的習慣、味道或地方有很深的依戀。", "Se1": "我對周遭環境的變化很敏銳，能馬上察覺並做出反應。", "Se2": "我喜歡直接動手、親身體驗，而不是先想太多。", "Ti1": "我需要自己把一件事的道理想通，才會真的接受它。", "Ti2": "我會注意到別人說法裡不精確或前後矛盾的地方。", "Te1": "我習慣設定目標、訂出步驟，然後有效率地把事情完成。", "Te2": "我判斷一個做法好不好，主要看它有沒有實際成效。", "Fi1": "即使沒有人知道，我也不會做違背自己原則的事。", "Fi2": "我很清楚什麼對我來說真正重要，不太受別人的看法影響。", "Fe1": "我會自然地調整說話方式，讓在場的人都覺得自在。", "Fe2": "團體裡有人情緒不對勁時，我通常很快就會注意到，並想做點什麼。", "Ns1": ["開始一個新企劃時，你比較常：", "腦中很快浮現一個清楚的方向，接著專心朝它前進", "先發想一大堆可能的做法，每一種都想試試"], "Ns2": ["聽到一個有趣的新觀念時，你比較常：", "聯想到它可以用在哪些不同的地方", "思考它背後真正的意義是什麼"], "Ns3": ["想到未來時，你比較像：", "心中有一個越來越清晰的畫面", "覺得有很多條路都值得走走看"], "Ss1": ["到一家常去的餐廳，你比較常：", "點每次都點的那道菜，因為知道它好吃", "看看今天有什麼新的、特別的，想試試"], "Ss2": ["學一項運動或手作技能時，你比較常：", "直接下場做，從身體的感覺去調整", "回想以前學過的類似經驗，照著步驟來"], "Ss3": ["回想一趟旅行時，你比較像：", "記得很多細節，還會和以前去過的地方比較", "當下玩得很投入，但細節記得沒那麼多"], "Ts1": ["解決一個問題時，你比較在意：", "徹底弄懂它為什麼會發生", "盡快找到有效的辦法，讓事情繼續前進"], "Ts2": ["團隊在討論做法時，你比較常：", "提出分工、時程和衡量標準", "檢查這個做法的邏輯有沒有說不通的地方"], "Ts3": ["別人說「這是業界的標準做法」，你比較可能：", "既然已經證實有效，就先照著做", "想先自己弄清楚它為什麼合理"], "Fs1": ["大家都同意某個決定，但你覺得不太對，你比較可能：", "堅持自己的立場，即使氣氛變得尷尬", "先顧全大局，找合適的時機再說"], "Fs2": ["安慰一位難過的朋友時，你比較常：", "配合他當下的需要，說他最需要聽到的話", "真誠說出你的感受，即使不一定是他想聽的"], "Fs3": ["判斷一件事該不該做時，你比較常問自己：", "這符合我自己的價值觀嗎？", "這對大家好嗎？別人會有什麼感受？"], "Nec": "我的想法通常很集中，很少從一個點子跳到另一個點子。", "Sic": "做決定時，我很少回頭參考過去的經驗。", "Tec": "我做事前通常不會先訂目標和步驟。", "Nic": "我很少對事情未來的發展有什麼預感。"}, "deep": {"posNames": ["英雄", "父母", "孩童", "劣勢", "對立", "批評者", "搗蛋鬼", "魔鬼"], "posDesc": ["你最信任、最常用的功能，遇到事情會先靠它。", "用來照顧自己和他人的功能，成熟、負責，替英雄把關。", "帶來玩心和創意的功能，用起來開心，但不太穩定。", "最沒把握的功能，容易讓你不安，也是長期成長的方向。", "別人用這個功能反對你時，你容易變得防衛或固執。", "內心挑剔的聲音，常用來批評自己，也批評別人。", "你的盲點。容易在這裡誤判，或不自覺地扭曲訊息。", "最陌生的功能。平常幾乎不用，極端壓力下可能以破壞性的方式出現。"], "health": {"Ni": ["有遠見，能看出事情的本質與走向", "鑽牛角尖，把直覺當成事實，聽不進反證"], "Ne": ["點子多，樂於嘗試，能看見新的可能", "三心二意，什麼都想做，卻都沒有完成"], "Si": ["穩定可靠，能從經驗中累積智慧", "抗拒改變，困在過去，或過度擔心出錯"], "Se": ["活在當下，反應靈敏，行動果決", "衝動、追求刺激，不顧後果"], "Ti": ["思考精確，能獨立看穿問題的核心", "鑽進細節，吹毛求疵，否定別人的看法"], "Te": ["有效率，能把目標化為成果", "控制欲強，只看結果，把人當成工具"], "Fi": ["真誠、有原則，尊重每個人的獨特", "自我中心，容易覺得被冒犯，不願溝通"], "Fe": ["體貼，能凝聚人心，營造和諧", "討好別人而失去自己，或用情緒施壓"]}, "grip": {"Se": "平常著眼長遠，壓力大時卻可能暴飲暴食、瘋狂追劇或衝動購物，沉迷在感官刺激裡。", "Ne": "平常穩重踏實，壓力大時卻開始胡思亂想，把各種最壞的可能都想過一遍。", "Si": "平常樂觀靈活，壓力大時卻執著於小細節或身體的小毛病，反覆想著過去的錯誤。", "Ni": "平常活在當下，壓力大時卻突然對未來充滿不祥的預感，覺得事情背後另有隱情。", "Fe": "平常冷靜理性，壓力大時卻變得情緒化，覺得沒人在乎自己，對別人的反應過度敏感。", "Fi": "平常果斷有效率，壓力大時卻突然覺得委屈、不被感謝，陷入自憐或情緒爆發。", "Te": "平常溫和包容，壓力大時卻變得尖銳挑剔，急著控制一切，批評別人沒效率。", "Ti": "平常體貼熱心，壓力大時卻變得冷漠挑剔，鑽牛角尖地找出邏輯上的錯，包括自己的。"}, "engage": {"Ni": "停下來想想這件事長遠來看會走向哪裡", "Ne": "找人聊聊，刻意列出三種不同的可能", "Si": "回到規律的作息，參考過去有效的做法", "Se": "離開腦袋，出門走走、運動，接觸實際的人和事", "Ti": "靜下來檢查這個想法在邏輯上站不站得住", "Te": "訂一個小目標，寫下步驟，先完成一件事", "Fi": "問問自己真正在乎的是什麼", "Fe": "找信任的人談談，聽聽別人的感受和看法"}, "healthEx": {"Ni": ["企劃做到一半，你察覺方向不對而提早調整，後來證明避開了一個大問題。", "認定同事「一定是在針對我」，即使對方解釋過，還是只相信自己的直覺。"], "Ne": ["開會卡住時，你一口氣丟出五種做法，其中一個成了解方。", "這個月開了三個新計畫、報了兩門課，結果沒有一樣做完。"], "Si": ["記得去年活動哪裡出過錯，今年提前準備好備案。", "新系統明明比較好用，你還是堅持「以前都這樣做」，不願意嘗試。"], "Se": ["現場設備臨時故障，你馬上找到替代方案，活動照常進行。", "一時興起刷卡買了很貴的東西，或臨時丟下重要的事跑去玩。"], "Ti": ["大家照慣例做事時，你發現流程裡有個邏輯漏洞，修正後省下一半時間。", "為了一個用詞精不精確和人爭論半小時，完全忘了原本要解決什麼。"], "Te": ["把一團亂的專案拆成清楚的分工和時程，讓大家準時完成。", "組員家裡有事請假，你只在意進度落後，還當面質疑他不夠負責。"], "Fi": ["所有人都說「大家都這樣做」，你還是婉拒去做違背原則的事。", "別人一句無心的話，你就認定對方不尊重你，從此冷淡以對、不解釋。"], "Fe": ["注意到新同事一個人吃飯，主動邀他加入，讓他很快融入團隊。", "明明累到不行，還是答應幫所有人的忙，事後再私下抱怨沒人體諒你。"]}, "gripEx": {"Se": "連續加班兩週後，某個晚上你突然吃掉一整桶冰淇淋、熬夜追完一整季影集，隔天再後悔。", "Ne": "主管說「明天找你談一下」，你整晚想的都是被資遣、出包、被檢討等各種最壞的情況。", "Si": "身體有點小痛，你就上網查到半夜，越查越確定是大病；或為了簡報裡一個錯字自責好幾天。", "Ni": "朋友晚回訊息，你突然確信這段友情要結束了，或覺得「我的人生大概就這樣了」。", "Fe": "在會議上被否定之後，你突然失控地說「反正你們都不在乎我的想法」，事後自己也很訝異。", "Fi": "拚了幾個月卻沒人道謝，你突然覺得「我做這麼多到底為了誰」，一個人生悶氣，甚至掉淚。", "Te": "被逼到極限時，你突然開始條列別人的每一個錯，用很衝的口氣要求大家照你的方式做。", "Ti": "付出沒有得到回應後，你變得冷冰冰，一條條分析「這段關係根本不合邏輯」，或苛刻地挑自己的毛病。"}, "demonEx": {"Si": "關係徹底破裂時，你把對方多年來每一次的過錯一條條翻出來清算，連日期都記得。", "Ni": "被逼到絕境時，你認定「一切早就注定會失敗」，乾脆親手毀掉經營多年的成果。", "Se": "情緒崩潰到極點時，你摔東西、飆車，或做出平常絕不會做的衝動行為。", "Ne": "走投無路時，你開始相信各種離譜的可能，覺得所有人都在算計你，並據此反擊。", "Ti": "被傷得很深時，你用冰冷的邏輯把對方的人格和價值拆解得一文不值。", "Te": "忍無可忍時，你變得冷酷專斷，用命令和施壓逼所有人照你的意思做。", "Fi": "被徹底否定時，你認定自己毫無價值，或為了自己的感受不計代價地報復。", "Fe": "到了極限時，你利用別人的情感或輿論去孤立、操控對方，事後連自己都覺得陌生。"}, "loopEx": {"INTJ": "你認定同事的提案別有用心，又覺得被冒犯，於是不去求證，只在心裡越想越確定、越想越氣。", "INFJ": "你反覆分析朋友一句話的「真正含意」，推理出一整套結論，卻始終沒有開口問他。", "INTP": "你想把一套理論想到完美才動手，結果每天窩在同一個地方、用同樣的方式反覆修改，幾個月沒有進展。", "ISTP": "你在腦中推演出「這件事一定會失敗」，於是什麼都不試，還越來越懷疑別人的動機。", "INFP": "你不斷重播多年前被傷害的那一幕，越想越難過，認定自己「就是這樣的人」，不願再嘗試新的事。", "ISFP": "朋友一次沒約你，你就覺得「他其實不喜歡我」，並預見這段關係終將結束，於是先疏遠對方。", "ISTJ": "你一直記著別人過去哪幾次沒守規矩，心裡越來越不滿，卻不說出口，也不調整做法。", "ISFJ": "你把過去犯的錯一件件拿出來分析，得出「我就是不夠好」的結論，卻沒有找任何人聊。", "ENTJ": "你不停接新案子、衝業績，再用消費或應酬犒賞自己，行程全滿，卻從沒停下來想這是不是自己要的方向。", "ESTJ": "你同時啟動好幾項改革，一有新點子就要大家馬上執行，方向一變再變，卻沒回頭看哪些做法其實有效。", "ENFJ": "你把行事曆排滿聚會和活動，忙著讓每個人開心、當場解決每個人的事，回到家卻覺得很空。", "ESFJ": "朋友已讀不回，你開始猜他是不是生氣了、是不是自己說錯話，到處問別人的看法，越問越慌。", "ENTP": "你不斷丟出新點子，享受大家的笑聲和掌聲，哪個點子反應熱烈就往哪裡去，卻沒檢查它到底可不可行。", "ENFP": "你一口氣開了五個計畫，排滿時程、到處聯絡，看起來很有生產力，卻沒問過自己真正在乎哪一個。", "ESTP": "你為了炒熱氣氛、贏得大家的喝采，一次比一次玩得更大，卻沒想過這樣做合不合理。", "ESFP": "你用滿滿的活動、消費和打卡填滿每一天，還替它們排好進度，卻一直迴避心裡真正的感受。"}}}, "zh-Hans": {"meta": {"htmlLang": "zh-Hans-CN", "title": "十六型人格测验", "sep": "、", "colon": "："}, "ui": {"eyebrow": "免费・约 10–15 分钟", "lead": "共 64 题，包含同意程度题和情境二选一题。请依照你“平常、自然的样子”作答，而不是你希望自己成为的样子。没有对错，也没有哪一型比较好，第一直觉通常最准。", "facts": ["<b>64</b> 题", "<b>4</b> 个向度", "<b>16</b> 种类型", "可加做 <b>32</b> 题认知功能高端测验", "作答进度会自动保存在此浏览器"], "start": "开始测验", "resume": "继续作答（已完成 {n} 题）", "restart": "重新开始", "disclaimer": "本测验依据荣格心理类型理论设计，供自我探索与教学讨论使用，并非官方 MBTI®，也不适合作为招募或诊断依据。", "pageOf": "第 {p} / {n} 页", "done": "已完成 {n} / {t}", "agree": "同意", "disagree": "不同意", "qLabel": "第 {n} 题", "likert": ["非常同意", "同意", "有点同意", "中立", "有点不同意", "不同意", "非常不同意"], "prev": "上一页", "home": "回首页", "next": "下一页", "see": "看结果", "neutralHint": "中间的小圆圈代表“中立”，请尽量少用。", "secScores": "四个向度的分数", "close": "这个向度两边很接近，你可能会依情境在两者之间切换。", "levels": ["轻微偏好", "中等偏好", "明显偏好", "非常明显"], "strengths": "你的优势", "blind": "需要留意的盲点", "work": "工作与职涯", "careerNote": "职业仅供参考。任何类型都能在各种领域表现出色，兴趣与能力同样重要。", "rel": "人际与感情", "growth": "成长建议", "cardH": "结果图卡", "cardNote": "手机请长按图片选“保存图片”；电脑请在图片上按右键“另存 "], ["容易冲动，忽略长期后果", "对理论与规划缺乏耐心", "可能不经意说话伤人"], "适合节奏快、能直接看到成果的工作。", ["业务", "创业", "运动教练", "警消救护", "活动运行"], "有趣、爱冒险，带来很多新鲜体验；要留意对方是否需要更多稳定感。", ["重要决定前停一下，想想三个月后", "培养一项需要长期累积的技能", "说话前想想对方的感受"]], "ESFP": ["舞台活力家", "开朗、热情，喜欢和人一起享受生活。天生有表演魅力，能让周遭气氛热络起来。", ["乐观开朗、带动气氛", "善于观察他人需求", "务实、懂得享受当下", "适应力强"], ["不喜欢长期规划", "容易受情绪与诱惑影响", "面对严肃问题时倾向逃避"], "适合与人交互、有表现机会的工作。", ["表演艺术", "活动主持", "业务", "餐饮服务", "幼儿教育"], "热情慷慨，喜欢一起体验新事物；也要学着面对关系中的难题。", ["每月设置一个小储蓄或学习目标", "遇到问题先处理，再放松", "给自己安静反思的时间"]]}, "items": {"EI0": "在聚会中，我通常会主动认识新朋友。", "EI1": "和一大群人相处一整天后，我需要独处来恢复精力。", "EI3": "比起大型聚会，我更喜欢和一两位好友深聊。", "EI4": "在团体中，我常是带动气氛的人。", "EI5": "遇到问题时，我倾向先自己想清楚再跟别人说。", "EI6": "一个人在家过周末，让我觉得很充实。", "EI7": "我很容易和陌生人聊起来。", "EI9": "参加活动时，我喜欢同时和很多人交互。", "EI11": "比起当面沟通，我更喜欢用文本消息。", "EI12": "太久没有和人交互，我会觉得闷。", "EI13": "常有人说“很难看出你在想什么”。", "EI14": "我喜欢在热闹、有人走动的环境中工作。", "SN0": "我比较相信亲身经验，而不是理论推测。", "SN1": "我常会想像未来可能发生的各种情境。", "SN2": "做事时，我习惯照着已经验证有效的方法。", "SN3": "我容易被抽象概念或哲学问题吸引。", "SN4": "我注意细节，常发现别人没注意到的地方。", "SN5": "读书或看电影时，我更在意背后的象征和意义。", "SN6": "描述事情时，我会说出具体的时间、地点和数字。", "SN7": "我常有天马行空的点子，但不一定会去实行。", "SN8": "我喜欢实用、能马上派上用场的知识。", "SN9": "我常在不同事物之间看出别人没发现的关联。", "SN11": "一成不变的例行工作，很快会让我失去耐心。", "SN14": "别人常说我是脚踏实地、务实的人。", "TF0": "做决定时，我优先考虑逻辑和客观事实。", "TF1": "我很容易察觉别人的情绪变化。", "TF2": "我认为直接指出问题，比顾及对方感受更重要。", "TF3": "看到别人难过时，我也会跟着难受。", "TF4": "争论时，我在意的是谁的论点比较正确。", "TF5": "做决定时，我会先考虑这对身边的人有什么影响。", "TF7": "维持团体和谐，对我来说很重要。", "TF8": "我觉得规则应该一视同仁，不该因人情而例外。", "TF10": "比起被喜欢，我更在意被认为有能力。", "TF11": "给别人负面意见时，我会花很多心思斟酌用字。", "TF12": "我喜欢分析问题的原因，找出最有效率的解法。", "TF13": "我常依照内心的价值观和感觉来做选择。", "JP0": "我喜欢事先把行程规划好。", "JP1": "我常在截止日前才开始全力冲刺。", "JP2": "我的桌面和房间通常井然有序。", "JP3": "旅行时，我喜欢随兴走，不排太满的行程。", "JP4": "事情有明确结论后，我才会觉得安心。", "JP5": "计划临时改变时，我通常能很快适应。", "JP6": "我习惯列待办清单，并一项项完成。", "JP7": "我喜欢保留选择空间，不想太早做决定。", "JP10": "守时对我来说很重要。", "JP11": "规则和流程常让我觉得被绑住。", "JP13": "我觉得在压力下临场发挥，反而效率更好。", "JP14": "我会提前准备，避免最后一刻手忙脚乱。", "EIs1": ["忙了一整周，终于到了周五晚上，你比较想：", "约朋友出去吃饭聊天，热闹一下", "回家做自己的事，安静充电"], "EIs2": ["小组讨论一个新题目时，你通常：", "先在心里想好，再说出比较完整的看法", "边讲边想，在讨论中把想法理出来"], "EIs3": ["参加一场大多是陌生人的活动，你比较可能：", "主动到处认识人，结束时多了不少新朋友", "找一两个聊得来的人，好好聊到结束"], "SNs1": ["学一套新的软件或工具时，你比较喜欢：", "跟着步骤实际操作一遍", "先弄懂整体架构和设计逻辑"], "SNs2": ["朋友向你介绍一个创业点子，你最先注意到的是：", "这个点子未来可以发展成什么", "实际要怎么运行、成本是多少"], "SNs3": ["逛完一个第一次去的展览，你记得最清楚的通常是：", "作品的细节：颜色、材质、摆设方式", "整体给你的感觉，以及它让你联想到的事"], "TFs1": ["朋友找你诉苦，说工作上被主管责备。你的第一反应比较接近：", "先安抚情绪，让他知道你懂他的感受", "帮他分析问题出在哪里、接下来可以怎么做"], "TFs2": ["你要在两位组员中选一位负责重要任务，你比较看重：", "谁的能力最适合这个任务", "谁最需要这个机会，以及选了之后团队的气氛"], "TFs3": ["同事的提案有明显的漏洞，在会议上你比较可能：", "直接指出问题，这样对事情最有帮助", "先肯定优点，会后再私下提醒"], "JPs1": ["规划一趟三天的旅行，你比较可能：", "先订好每天的行程和餐厅", "只订好住宿，其他到当地再看"], "JPs2": ["一份两周后要交的报告，你通常：", "在最后几天集中火力完成", "先排好进度，分几天陆续完成"], "JPs3": ["周末突然多出一整天空档，你比较想：", "看当下的心情，想到什么做什么", "列出想做的事，安排一下顺序"], "EIc": "和不认识的人聊天，对我来说有点吃力。", "SNc": "讨论抽象的理论，很快就让我觉得无聊。", "TFc": "做决定时，我更常跟着感觉走，而不是分析利弊。", "JPc": "出门或旅行前，我通常不会先做规划。", "Ni1": "我常在没有明确理由的情况下，就对事情最后会怎么发展有很强的预感。", "Ni2": "我习惯把许多线索收拢成一个内核的想法或方向。", "Ne1": "一个点子常会让我接连想到更多点子，停不下来。", "Ne2": "我喜欢同时探索很多种可能，而不是太早锁定一个答案。", "Si1": "我会拿现在的情况和过去的经验比较，来判断该怎么做。", "Si2": "我对熟悉的习惯、味道或地方有很深的依恋。", "Se1": "我对周遭环境的变化很敏锐，能马上察觉并做出反应。", "Se2": "我喜欢直接动手、亲身体验，而不是先想太多。", "Ti1": "我需要自己把一件事的道理想通，才会真的接受它。", "Ti2": "我会注意到别人说法里不精确或前后矛盾的地方。", "Te1": "我习惯设置目标、订出步骤，然后有效率地把事情完成。", "Te2": "我判断一个做法好不好，主要看它有没有实际成效。", "Fi1": "即使没有人知道，我也不会做违背自己原则的事。", "Fi2": "我很清楚什么对我来说真正重要，不太受别人的看法影响。", "Fe1": "我会自然地调整说话方式，让在场的人都觉得自在。", "Fe2": "团体里有人情绪不对劲时，我通常很快就会注意到，并想做点什么。", "Ns1": ["开始一个新企划时，你比较常：", "脑中很快浮现一个清楚的方向，接着专心朝它前进", "先发想一大堆可能的做法，每一种都想试试"], "Ns2": ["听到一个有趣的新观念时，你比较常：", "联想到它可以用在哪些不同的地方", "思考它背后真正的意义是什么"], "Ns3": ["想到未来时，你比较像：", "心中有一个越来越清晰的画面", "觉得有很多条路都值得走走看"], "Ss1": ["到一家常去的餐厅，你比较常：", "点每次都点的那道菜，因为知道它好吃", "看看今天有什么新的、特别的，想试试"], "Ss2": ["学一项运动或手作技能时，你比较常：", "直接下场做，从身体的感觉去调整", "回想以前学过的类似经验，照着步骤来"], "Ss3": ["回想一趟旅行时，你比较像：", "记得很多细节，还会和以前去过的地方比较", "当下玩得很投入，但细节记得没那么多"], "Ts1": ["解决一个问题时，你比较在意：", "彻底弄懂它为什么会发生", "尽快找到有效的办法，让事情继续前进"], "Ts2": ["团队在讨论做法时，你比较常：", "提出分工、时程和衡量标准", "检查这个做法的逻辑有没有说不通的地方"], "Ts3": ["别人说“这是业界的标准做法”，你比较可能：", "既然已经证实有效，就先照着做", "想先自己弄清楚它为什么合理"], "Fs1": ["大家都同意某个决定，但你觉得不太对，你比较可能：", "坚持自己的立场，即使气氛变得尴尬", "先顾全大局，找合适的时机再说"], "Fs2": ["安慰一位难过的朋友时，你比较常：", "配合他当下的需要，说他最需要听到的话", "真诚说出你的感受，即使不一定是他想听的"], "Fs3": ["判断一件事该不该做时，你比较常问自己：", "这符合我自己的价值观吗？", "这对大家好吗？别人会有什么感受？"], "Nec": "我的想法通常很集中，很少从一个点子跳到另一个点子。", "Sic": "做决定时，我很少回头参考过去的经验。", "Tec": "我做事前通常不会先订目标和步骤。", "Nic": "我很少对事情未来的发展有什么预感。"}, "deep": {"posNames": ["英雄", "父母", "孩童", "劣势", "对立", "批评者", "捣蛋鬼", "魔鬼"], "posDesc": ["你最信任、最常用的功能，遇到事情会先靠它。", "用来照顾自己和他人的功能，成熟、负责，替英雄把关。", "带来玩心和创意的功能，用起来开心，但不太稳定。", "最没把握的功能，容易让你不安，也是长期成长的方向。", "别人用这个功能反对你时，你容易变得防卫或固执。", "内心挑剔的声音，常用来批评自己，也批评别人。", "你的盲点。容易在这里误判，或不自觉地扭曲消息。", "最陌生的功能。平常几乎不用，极端压力下可能以破坏性的方式出现。"], "health": {"Ni": ["有远见，能看出事情的本质与走向", "钻牛角尖，把直觉当成事实，听不进反证"], "Ne": ["点子多，乐于尝试，能看见新的可能", "三心二意，什么都想做，却都没有完成"], "Si": ["稳定可靠，能从经验中累积智能", "抗拒改变，困在过去，或过度担心出错"], "Se": ["活在当下，反应灵敏，行动果决", "冲动、追求刺激，不顾后果"], "Ti": ["思考精确，能独立看穿问题的内核", "钻进细节，吹毛求疵，否定别人的看法"], "Te": ["有效率，能把目标化为成果", "控制欲强，只看结果，把人当成工具"], "Fi": ["真诚、有原则，尊重每个人的独特", "自我中心，容易觉得被冒犯，不愿沟通"], "Fe": ["体贴，能凝聚人心，营造和谐", "讨好别人而失去自己，或用情绪施压"]}, "grip": {"Se": "平常着眼长远，压力大时却可能暴饮暴食、疯狂追剧或冲动购物，沉迷在感官刺激里。", "Ne": "平常稳重踏实，压力大时却开始胡思乱想，把各种最坏的可能都想过一遍。", "Si": "平常乐观灵活，压力大时却执著于小细节或身体的小毛病，反复想着过去的错误。", "Ni": "平常活在当下，压力大时却突然对未来充满不祥的预感，觉得事情背后另有隐情。", "Fe": "平常冷静理性，压力大时却变得情绪化，觉得没人在乎自己，对别人的反应过度敏感。", "Fi": "平常果断有效率，压力大时却突然觉得委屈、不被感谢，陷入自怜或情绪爆发。", "Te": "平常温和包容，压力大时却变得尖锐挑剔，急着控制一切，批评别人没效率。", "Ti": "平常体贴热心，压力大时却变得冷漠挑剔，钻牛角尖地找出逻辑上的错，包括自己的。"}, "engage": {"Ni": "停下来想想这件事长远来看会走向哪里", "Ne": "找人聊聊，刻意列出三种不同的可能", "Si": "回到规律的作息，参考过去有效的做法", "Se": "离开脑袋，出门走走、运动，接触实际的人和事", "Ti": "静下来检查这个想法在逻辑上站不站得住", "Te": "订一个小目标，写下步骤，先完成一件事", "Fi": "问问自己真正在乎的是什么", "Fe": "找信任的人谈谈，听听别人的感受和看法"}, "healthEx": {"Ni": ["企划做到一半，你察觉方向不对而提早调整，后来证明避开了一个大问题。", "认定同事“一定是在针对我”，即使对方解释过，还是只相信自己的直觉。"], "Ne": ["开会卡住时，你一口气丢出五种做法，其中一个成了解方。", "这个月开了三个新计划、报了两门课，结果没有一样做完。"], "Si": ["记得去年活动哪里出过错，今年提前准备好备案。", "新系统明明比较好用，你还是坚持“以前都这样做”，不愿意尝试。"], "Se": ["现场设备临时故障，你马上找到替代方案，活动照常进行。", "一时兴起刷卡买了很贵的东西，或临时丢下重要的事跑去玩。"], "Ti": ["大家照惯例做事时，你发现流程里有个逻辑漏洞，修正后省下一半时间。", "为了一个用词精不精确和人争论半小时，完全忘了原本要解决什么。"], "Te": ["把一团乱的项目拆成清楚的分工和时程，让大家准时完成。", "组员家里有事请假，你只在意进度落后，还当面质疑他不够负责。"], "Fi": ["所有人都说“大家都这样做”，你还是婉拒去做违背原则的事。", "别人一句无心的话，你就认定对方不尊重你，从此冷淡以对、不解释。"], "Fe": ["注意到新同事一个人吃饭，主动邀他加入，让他很快融入团队。", "明明累到不行，还是答应帮所有人的忙，事后再私下抱怨没人体谅你。"]}, "gripEx": {"Se": "连续加班两周后，某个晚上你突然吃掉一整桶冰淇淋、熬夜追完一整季影集，隔天再后悔。", "Ne": "主管说“明天找你谈一下”，你整晚想的都是被资遣、出包、被检讨等各种最坏的情况。", "Si": "身体有点小痛，你就上网查到半夜，越查越确定是大病；或为了演示文稿里一个错字自责好几天。", "Ni": "朋友晚回消息，你突然确信这段友情要结束了，或觉得“我的人生大概就这样了”。", "Fe": "在会议上被否定之后，你突然失控地说“反正你们都不在乎我的想法”，事后自己也很讶异。", "Fi": "拚了几个月却没人道谢，你突然觉得“我做这么多到底为了谁”，一个人生闷气，甚至掉泪。", "Te": "被逼到极限时，你突然开始条列别人的每一个错，用很冲的口气要求大家照你的方式做。", "Ti": "付出没有得到回应后，你变得冷冰冰，一条条分析“这段关系根本不合逻辑”，或苛刻地挑自己的毛病。"}, "demonEx": {"Si": "关系彻底破裂时，你把对方多年来每一次的过错一条条翻出来清算，连日期都记得。", "Ni": "被逼到绝境时，你认定“一切早就注定会失败”，干脆亲手毁掉经营多年的成果。", "Se": "情绪崩溃到极点时，你摔东西、飙车，或做出平常绝不会做的冲动行为。", "Ne": "走投无路时，你开始相信各种离谱的可能，觉得所有人都在算计你，并据此反击。", "Ti": "被伤得很深时，你用冰冷的逻辑把对方的人格和价值拆解得一文不值。", "Te": "忍无可忍时，你变得冷酷专断，用命令和施压逼所有人照你的意思做。", "Fi": "被彻底否定时，你认定自己毫无价值，或为了自己的感受不计代价地报复。", "Fe": "到了极限时，你利用别人的情感或舆论去孤立、操控对方，事后连自己都觉得陌生。"}, "loopEx": {"INTJ": "你认定同事的提案别有用心，又觉得被冒犯，于是不去求证，只在心里越想越确定、越想越气。", "INFJ": "你反复分析朋友一句话的“真正含意”，推理出一整套结论，却始终没有开口问他。", "INTP": "你想把一套理论想到完美才动手，结果每天窝在同一个地方、用同样的方式反复修改，几个月没有进展。", "ISTP": "你在脑中推演出“这件事一定会失败”，于是什么都不试，还越来越怀疑别人的动机。", "INFP": "你不断重播多年前被伤害的那一幕，越想越难过，认定自己“就是这样的人”，不愿再尝试新的事。", "ISFP": "朋友一次没约你，你就觉得“他其实不喜欢我”，并预见这段关系终将结束，于是先疏远对方。", "ISTJ": "你一直记着别人过去哪几次没守规矩，心里越来越不满，却不说出口，也不调整做法。", "ISFJ": "你把过去犯的错一件件拿出来分析，得出“我就是不够好”的结论，却没有找任何人聊。", "ENTJ": "你不停接新案子、冲业绩，再用消费或应酬犒赏自己，行程全满，却从没停下来想这是不是自己要的方向。", "ESTJ": "你同时启动好几项改革，一有新点子就要大家马上运行，方向一变再变，却没回头看哪些做法其实有效。", "ENFJ": "你把行事历排满聚会和活动，忙着让每个人开心、当场解决每个人的事，回到家却觉得很空。", "ESFJ": "朋友已读不回，你开始猜他是不是生气了、是不是自己说错话，到处问别人的看法，越问越慌。", "ENTP": "你不断丢出新点子，享受大家的笑声和掌声，哪个点子反应热烈就往哪里去，却没检查它到底可不可行。", "ENFP": "你一口气开了五个计划，排满时程、到处联系，看起来很有生产力，却没问过自己真正在乎哪一个。", "ESTP": "你为了炒热气氛、赢得大家的喝采，一次比一次玩得更大，却没想过这样做合不合理。", "ESFP": "你用满满的活动、消费和打卡填满每一天，还替它们排好进度，却一直回避心里真正的感受。"}}}, "en": {"meta": {"htmlLang": "en", "title": "16-Type Personality Test", "sep": ", ", "colon": ": "}, "ui": {"eyebrow": "Free · About 10–15 minutes", "lead": "64 questions: agreement ratings plus two-option scenarios. Answer as you usually and naturally are, not as you wish you were. There are no right or wrong answers and no type is better than another, so go with your first instinct.", "facts": ["<b>64</b> questions", "<b>4</b> dimensions", "<b>16</b> types", "Optional <b>32</b>-question cognitive function test", "Your progress is saved in this browser"], "start": "Start the test", "resume": "Continue ({n} answered)", "restart": "Start over", "disclaimer": "This test is based on Jungian psychological type theory and is meant for self-discovery and classroom discussion. It is not the official MBTI® and should not be used for hiring or diagnosis.", "pageOf": "Page {p} of {n}", "done": "{n} / {t} answered", "agree": "Agree", "disagree": "Disagree", "qLabel": "Statement {n}", "likert": ["Strongly agree", "Agree", "Somewhat agree", "Neutral", "Somewhat disagree", "Disagree", "Strongly disagree"], "prev": "Back", "home": "Home", "next": "Next", "see": "See my results", "neutralHint": "The small middle circle means neutral. Try to use it sparingly.", "secScores": "Your four dimensions", "close": "The two sides are close here, so you may switch between them depending on the situation.", "levels": ["Slight preference", "Moderate preference", "Clear preference", "Very clear preference"], "strengths": "Your strengths", "blind": "Blind spots to watch", "work": "Work and career", "careerNote": "Careers are suggestions only. Every type can excel in any field; interests and skills matter just as much.", "rel": "Relationships", "growth": "Growth tips", "cardH": "Result card", "cardNote": "On a phone, press and hold the image to save it. On a computer, right-click it and choose Save Image.", "cardAlt": "result card", "textH": "Text summary", "textNote": "Copy the text below to paste into your notes or send to a friend.", "copy": "Copy summary", "redo": "Retake the test", "edit": "Change answers", "copied": "Copied to clipboard", "selected": "Text selected. Press Ctrl/⌘ + C to copy.", "finalNote": "Personality types describe preferences, not abilities or limits. Results can shift with age, setting and mood, so treat this as a starting point for knowing yourself.", "txtTitle": "16-Type Personality Test Result", "txtType": "Type", "txtScores": "Dimensions", "txtStr": "Strengths", "txtBlind": "Blind spots", "txtWork": "Work", "txtCareer": "Suggested fields", "txtRel": "Relationships", "txtGrowth": "Growth tips", "cardFooter": "Based on Jungian type theory · For self-discovery only", "fnH": "Cognitive functions", "fnNote": "In Jungian theory, each type uses four main cognitive functions, ordered from strongest to weakest. A larger oval means the function is used more. Left of the dashed line works inward; right of it works outward.", "fnInner": "Inner world (introverted)", "fnOuter": "Outer world (extraverted)", "fnDisclaimer": "Cognitive functions are mapped from your four-letter type. This test does not measure them directly.", "roles": ["Dominant", "Auxiliary", "Tertiary", "Inferior"], "roleDesc": ["Your most natural, most used function and the core of who you are.", "Supports the dominant function and keeps you balanced.", "Still developing; it shows up more when you relax or play.", "Your least practiced function. It can misfire under stress, and it is also where you can grow."], "part2": "Advanced test", "p2Title": "Advanced: cognitive function test", "p2Intro": "Answer 32 more questions (about 5–8 minutes) to measure the eight cognitive functions directly and compare them with the theoretical order above.", "p2Start": "Start the advanced test", "p2Resume": "Continue advanced test ({n} answered)", "p2Edit": "Change advanced answers", "backResult": "Back to results", "fnMeasuredH": "Your measured functions", "fnMeasuredNote": "A higher score means you use that function more. Tags show its place in the theoretical order for {type}.", "fitH": "Best-matching types", "fitNote": "Your eight function scores compared with the theoretical profile of all 16 types. The three closest:", "match": "Match", "fitSame": "The advanced test points to the same type as your four-letter result, so the two methods support each other.", "fitTop3": "Your four-letter type {type} ranks #{n} here, so the two methods are broadly close. Read the description of {best} too and see which fits you better.", "fitDiff": "The advanced test matches {best} best, which differs from your four-letter type {type}. This is common and may mean some of your preferences are not clear-cut. Both descriptions are worth reading.", "qcH": "Answer consistency", "qcNote": "The test includes a few check pairs with opposite wording. If you agree with both statements in a pair, or disagree with both, the pair counts as inconsistent.", "qcScore": "{ok} of {n} pairs consistent", "qcGood": "Your answers are consistent, which makes the result more trustworthy.", "qcWarn": "{k} pair(s) were answered inconsistently, so read the related results with some caution.", "qcBad": "Several pairs were inconsistent, so the result may not be accurate. Consider retaking the test at a quiet time, answering as you usually are.", "qcPair": "Inconsistent pairs", "styleAgree": "You agreed with most statements, which can make the result less accurate.", "styleNeutral": "You chose neutral often, which can make your preferences look weaker than they are.", "txtQc": "Answer consistency", "txtFit": "Best function match", "deepH": "In depth: function positions and stress states", "deepNote": "Derived from your type using John Beebe's eight-function model. This is a theoretical description, not a measurement.", "posH": "The eight function positions", "posConscious": "Four conscious functions", "posShadow": "Four unconscious functions", "healthH": "Healthy and unhealthy expressions", "healthy": "When healthy", "unhealthy": "When unhealthy", "loopH": "Loop", "gripH": "Grip", "demonH": "Demon function", "loopI": "When you skip your auxiliary function {aux}, you circle between {dom} and {ter}, two inward-facing functions: you think more and more without checking against the outside world and drift away from reality.", "loopE": "When you skip your auxiliary function {aux}, you circle between {dom} and {ter}, two outward-facing functions: you keep acting and reacting without pausing to look inward, growing busier and emptier.", "loopExit": "To break the loop, deliberately engage your auxiliary function {aux}: {hint}.", "loopFlag": "In your advanced test, your tertiary function {ter} scored higher than your auxiliary {aux}, so watch whether you often fall into this loop.", "gripIntro": "Under prolonged stress or exhaustion, your inferior function {inf} may suddenly take over and make you unlike yourself:", "gripExit": "This is not the time for big decisions. Rest and lower the pressure first, and let your dominant function {dom} recover.", "demonText": "Your demon function {f} ({name}) is the one you know least. In extreme situations it may appear destructively; with maturity, it can also become an unexpected strength.", "eg": "For example: ", "tabs": {"over": "Overview", "life": "Life & growth", "fn": "Cognitive functions", "deep": "In depth", "share": "Save & share"}, "tabsLabel": "Result sections", "nextPart": "Next: {name}"}, "fns": {"Ni": ["Introverted Intuition", "Pulls clues together internally to form insight and a sense of where things are heading."], "Ne": ["Extraverted Intuition", "Explores possibilities in the world, makes connections and generates new ideas."], "Si": ["Introverted Sensing", "Draws on past experience and memory, valuing the familiar, the stable and the detailed."], "Se": ["Extraverted Sensing", "Focuses on what is happening right now, reacting quickly and enjoying hands-on action."], "Ti": ["Introverted Thinking", "Builds an internal logical framework, seeking precision and an understanding of how things work."], "Te": ["Extraverted Thinking", "Organizes the outside world by objective standards, valuing efficiency and results."], "Fi": ["Introverted Feeling", "Judges right and wrong by inner values, valuing authenticity and being true to oneself."], "Fe": ["Extraverted Feeling", "Senses and responds to others' emotions, valuing harmony and connection."]}, "dims": {"EI": {"an": "Extraversion", "bn": "Introversion", "q": "Where does your energy come from?", "ad": "You gain energy from people and outside activity, and you tend to think while talking and adjust as you go.", "bd": "You recharge through solitude and reflection, and you tend to think things through before speaking or acting."}, "SN": {"an": "Sensing", "bn": "Intuition", "q": "How do you take in information?", "ad": "You value concrete facts and direct experience, focus on the present and details, and prefer practical approaches.", "bd": "You value patterns and possibilities, focus on the future and meaning, and enjoy new ideas and abstract concepts."}, "TF": {"an": "Thinking", "bn": "Feeling", "q": "How do you make decisions?", "ad": "You decide mainly by logic and objective standards, valuing fairness and efficiency.", "bd": "You decide mainly by values and how people will feel, valuing harmony and understanding."}, "JP": {"an": "Judging", "bn": "Perceiving", "q": "How do you approach the outside world?", "ad": "You like to plan ahead and go step by step, and you feel at ease once things are settled.", "bd": "You like to stay flexible and adapt as you go, enjoying an open, exploratory process."}}, "groups": {"NT": "Rational Thinkers", "NF": "Idealists", "SJ": "Steady Guardians", "SP": "Flexible Explorers"}, "types": {"INTJ": ["Visionary Strategist", "Independent and rational, you see the big picture and map out the steps to get there. You hold high standards and turn complex problems into clear systems.", ["Long-range strategy", "Independent judgment", "Learns new fields fast", "Strong determination"], ["Can seem distant or hard to approach", "Impatient with inefficiency", "May underestimate the role of emotions"], "You thrive with autonomy and room to dig deep, and dislike pointless meetings and red tape.", ["Strategy", "Systems architecture", "Research", "Data analysis", "Product management"], "You value a few deep friendships and often show care by solving problems for people. You need partners who respect your alone time.", ["Ask how others feel before sharing your conclusion", "Accept that good enough sometimes beats perfect", "Explain your reasoning out loud so others can follow"]], "INTP": ["Principle Explorer", "Deeply curious, you love taking ideas apart to see how they work. Flexible in thought, you enjoy theories and ideas for their own sake.", ["Sharp analysis", "Open to new views", "Abstract modeling", "Calm and objective"], ["Ideas often stay unfinished", "Overlooks everyday details", "Can be too blunt"], "You do best where there are complex problems and freedom to explore.", ["Software development", "Scientific research", "Academia", "Engineering", "Game design"], "You are loyal to those close to you but slow to express feelings, and you enjoy people who will explore wild ideas with you.", ["Give each idea a deadline and a first step", "Explain things in terms others understand", "Review your everyday to-dos regularly"]], "ENTJ": ["Goal Driver", "Decisive and confident, you naturally lead teams toward a goal. You organize resources, make the call and drive execution.", ["Quick, bold decisions", "Turns vision into plans", "Direct and persuasive", "Results-focused"], ["Can seem forceful or impatient", "May overlook others' feelings and pace", "Reluctant to show vulnerability"], "You perform best when leading, with clear goals and room to grow.", ["Management", "Entrepreneurship", "Project management", "Consulting", "Law"], "You commit fully and plan a shared future, but need to set aside the manager role in close relationships.", ["Hear one more round of opinions before deciding", "Praise effort, not only results", "Rest without turning it into a task"]], "ENTP": ["Idea Sparker", "Quick-witted and fond of challenges, you look at problems from every angle. Debate is fun for you and often sparks fresh ideas.", ["Creative and flexible", "Articulate and sharp", "Challenges convention", "Adapts easily"], ["Loses interest before finishing", "Debates can feel disrespectful", "Impatient with routine"], "You suit varied work where you can pitch ideas and innovate.", ["Marketing", "Entrepreneurship", "Journalism", "Consulting", "Product development"], "Fun and full of surprises, you enjoy partners who spar with ideas, but keep the debating out of the relationship.", ["Pick one idea and see it through", "Check whether others want a debate first", "Hand details to capable partners and respect their work"]], "INFJ": ["Insightful Guide", "Quiet and deep, you understand what others feel and hold ideals for a better world. Gentle on the outside, firm in your principles.", ["Reads between the lines", "Principled and idealistic", "Good listener and advisor", "Committed to meaningful goals"], ["Absorbs others' emotions and burns out", "Perfectionist about yourself", "Quietly cuts ties when misunderstood"], "You suit work that helps others and matches your values.", ["Counseling", "Education", "Social work", "Writing", "People development"], "You long for deep, genuine connection and dislike small talk, and you need space to be alone sometimes.", ["Learn to say no and protect your energy", "Say what you expect instead of hoping others guess", "Allow plans and people to be imperfect"]], "INFP": ["Ideal Seeker", "Gentle and imaginative, you value authenticity and your inner values. Sensitive to beauty, you express yourself through creativity and care.", ["Deep empathy", "Rich imagination", "True to your values", "Expressive in words and art"], ["Idealizes, then feels let down", "Avoids conflict", "Struggles with practical planning"], "You suit meaningful, creative and flexible work.", ["Design", "Writing and editing", "Psychology", "Illustration", "Nonprofits"], "Romantic and sincere, you invest deeply and need to be accepted as you truly are.", ["Break big dreams into steps you can do today", "Voice concerns early instead of storing them up", "Be kinder to yourself"]], "ENFJ": ["Passionate Leader", "Warm and inspiring, you bring people together and help them grow. Group harmony and everyone's growth matter to you.", ["Inspiring communicator", "Senses team needs", "Responsible organizer", "Wants others to thrive"], ["Cares too much about others' opinions", "Neglects own needs", "May overstep in others' choices"], "You suit roles that involve teamwork, leading or mentoring.", ["Teaching", "Human resources", "Public relations", "Organizational leadership", "Sales management"], "You are attentive and invested in relationships. Remember to let others care for you too.", ["Keep some time each week just for yourself", "Accept that not everyone needs your help", "Separate criticism of the work from criticism of you"]], "ENFP": ["Inspiration Spark", "Enthusiastic and curious, you find new possibilities everywhere. You connect easily and bring energy and optimism to those around you.", ["Contagious enthusiasm", "Full of ideas", "Makes friends easily", "Sees the best in people"], ["Easily distracted", "Dislikes detail and repetition", "Mood can swing"], "You enjoy creative, people-facing work with plenty of variety.", ["Marketing", "Event planning", "Education", "Media", "Entrepreneurship"], "Warm and expressive, you love sharing life and need space to explore.", ["Use lists or timers to stay focused", "Check your time and energy before saying yes", "When excitement fades, recall why you started"]], "ISTJ": ["Reliable Executor", "Steady and responsible, you take things one step at a time. You honor rules and commitments and are the person a team can count on.", ["Keeps promises", "Precise with details", "Organized planner", "Calm under pressure"], ["Resists change", "Can seem rigid", "Rarely shows emotion"], "You suit structured work that values accuracy.", ["Accounting", "Administration", "Engineering", "Quality control", "Civil service"], "You show love through actions and are deeply loyal. Try putting your care into words more often.", ["Try a new method on a small task", "Hear people out before judging", "Say thank you and share your feelings now and then"]], "ISFJ": ["Caring Protector", "Gentle and thoughtful, you quietly look after the people around you. You remember small details and value tradition and stability.", ["Attentive and caring", "Patient and dependable", "Thorough and practical", "Devoted to team and family"], ["Finds it hard to say no", "Uneasy with change", "Hurt when effort goes unseen"], "You suit steady work that involves caring for others.", ["Nursing", "Education", "Office support", "Customer service", "Social work"], "Loyal and tender, you remember what others like, and you also need to feel seen and appreciated.", ["Practice stating your own needs", "Separate others' expectations from your responsibilities", "Give new things a chance"]], "ESTJ": ["Order Keeper", "Practical and organized, you build rules and systems that keep things running. Direct and frank, you value efficiency and responsibility.", ["Strong execution", "Efficient and results-driven", "Honest and trustworthy", "Delegates clearly"], ["Inflexible about other methods", "Bluntness can pressure others", "Overlooks emotional needs"], "You suit roles with management, structure and clear results.", ["Management", "Operations", "Finance", "Law", "Military and police"], "You take commitment seriously and handle everything for your family. Allow a little more flexibility and romance.", ["Ask whether there is another way before deciding", "Lead feedback with praise", "Let others do things their own way"]], "ESFJ": ["Warm Harmonizer", "Kind and sociable, you enjoy taking care of everyone's needs. You create a warm atmosphere and hold the group together.", ["Helpful and caring", "Great with people", "Responsible and reliable", "Good at coordinating"], ["Worries about others' opinions", "Takes criticism hard", "Hides disagreement to keep the peace"], "You suit people-facing work with clear roles.", ["Education", "Healthcare", "Human resources", "Event planning", "Customer service"], "Thoughtful and fond of traditions and special occasions, you need appreciation in return.", ["You don't have to please everyone", "Treat criticism as information, not rejection", "Practice voicing a different opinion"]], "ISTP": ["Calm Craftsman", "Calm and practical, you like getting hands-on to learn how things work. You react quickly in a crisis and find workable solutions.", ["Cool under pressure", "Hands-on problem solver", "Independent and efficient", "Keen observer"], ["Avoids long-term commitments", "Rarely expresses feelings", "Bored by routine"], "You suit hands-on work with plenty of freedom.", ["Engineering", "Mechanics", "Cybersecurity", "Sports", "Emergency services"], "You give each other space and show up through actions. Try sharing more of what's inside.", ["Set one long-term goal", "Put your feelings into simple words", "Consider the impact on others before deciding"]], "ISFP": ["Free-Spirited Creator", "Gentle and sensitive, you live in the moment and enjoy life's beauty. Low-key, but with a distinctive taste of your own.", ["Strong sense of beauty", "Accepting, not judgmental", "Enjoys the present", "Adapts well"], ["Avoids planning ahead", "Withdraws from conflict", "Underestimates own abilities"], "You suit creative work in a harmonious setting.", ["Design", "Photography", "Crafts", "Beauty and styling", "Animal care"], "Tender and caring, you show love through small gestures and need respect without pressure.", ["Add some structure to important things", "Practice standing your ground in conflict", "Let others see your work and ideas"]], "ESTP": ["Action Taker", "Energetic and quick, you learn by doing. You read situations fast and act on opportunities immediately.", ["Bold and action-oriented", "Quick improviser", "Practical and results-focused", "Funny and social"], ["Impulsive about long-term effects", "Impatient with theory and plans", "Careless words can hurt"], "You suit fast-paced work with visible results.", ["Sales", "Entrepreneurship", "Coaching", "Emergency services", "Event operations"], "Fun and adventurous, you bring new experiences. Check whether your partner needs more stability.", ["Before big decisions, picture three months ahead", "Build a skill that takes time", "Think about others' feelings before speaking"]], "ESFP": ["Stage Energizer", "Cheerful and lively, you love enjoying life with others. A natural performer, you light up any room.", ["Upbeat and lively", "Reads others' needs", "Enjoys the moment", "Highly adaptable"], ["Dislikes long-term planning", "Swayed by mood and temptation", "Avoids serious issues"], "You suit people-facing roles with a chance to shine.", ["Performing arts", "Hosting", "Sales", "Hospitality", "Early childhood education"], "Warm and generous, you love sharing new experiences, and you also need to face hard conversations.", ["Set a small monthly saving or learning goal", "Handle problems first, then relax", "Make time for quiet reflection"]]}, "items": {"EI0": "At gatherings, I usually introduce myself to new people.", "EI1": "After a full day with a big group, I need time alone to recharge.", "EI3": "I prefer deep talks with one or two friends over big parties.", "EI4": "In a group, I'm often the one who livens things up.", "EI5": "When facing a problem, I prefer to think it through before telling anyone.", "EI6": "A weekend alone at home feels fulfilling to me.", "EI7": "I find it easy to strike up conversations with strangers.", "EI9": "At events, I like interacting with lots of people at once.", "EI11": "I prefer texting over talking face to face.", "EI12": "If I go too long without seeing people, I feel restless.", "EI13": "People often say it's hard to tell what I'm thinking.", "EI14": "I like working in busy places with people around.", "SN0": "I trust hands-on experience more than theory.", "SN1": "I often imagine different ways the future could play out.", "SN2": "I like to stick with methods that have proven to work.", "SN3": "Abstract ideas and philosophical questions draw me in.", "SN4": "I notice details that others often miss.", "SN5": "In books and films, I care most about the symbolism and deeper meaning.", "SN6": "When I describe something, I include specific times, places and numbers.", "SN7": "I often have wild ideas, but I don't always act on them.", "SN8": "I like practical knowledge I can use right away.", "SN9": "I often see connections between things that others don't.", "SN11": "Repetitive routine work quickly wears down my patience.", "SN14": "People describe me as practical and down-to-earth.", "TF0": "When deciding, I put logic and objective facts first.", "TF1": "I easily notice changes in other people's moods.", "TF2": "Pointing out a problem directly matters more than sparing someone's feelings.", "TF3": "When I see someone upset, I feel upset too.", "TF4": "In an argument, what matters to me is whose point is more correct.", "TF5": "Before deciding, I consider how it will affect the people around me.", "TF7": "Keeping harmony in a group is important to me.", "TF8": "Rules should apply equally to everyone, with no exceptions for friends.", "TF10": "I care more about being seen as competent than being liked.", "TF11": "When giving criticism, I put a lot of thought into my wording.", "TF12": "I like analyzing why a problem happened and finding the most efficient fix.", "TF13": "I often make choices based on my inner values and feelings.", "JP0": "I like to plan my schedule in advance.", "JP1": "I often only go all-out right before a deadline.", "JP2": "My desk and room are usually tidy and organized.", "JP3": "When traveling, I like to wander freely without a packed itinerary.", "JP4": "I only feel at ease once things are settled.", "JP5": "When plans change suddenly, I usually adapt quickly.", "JP6": "I make to-do lists and work through them one by one.", "JP7": "I like keeping my options open rather than deciding too early.", "JP10": "Being on time matters a lot to me.", "JP11": "Rules and procedures often make me feel boxed in.", "JP13": "I work better when improvising under pressure.", "JP14": "I prepare ahead to avoid a last-minute rush.", "EIs1": ["After a busy week, it's finally Friday night. You would rather:", "Go out to eat and chat with friends", "Head home and recharge quietly on your own"], "EIs2": ["When your group discusses a new topic, you usually:", "Think it through first, then share a fairly complete view", "Think out loud and shape your ideas as the discussion goes"], "EIs3": ["At an event where you know almost no one, you are more likely to:", "Move around and meet lots of new people", "Find one or two people you click with and talk until the end"], "SNs1": ["When learning a new app or tool, you prefer to:", "Follow the steps and try it hands-on", "Understand the overall structure and design logic first"], "SNs2": ["A friend pitches a business idea. The first thing you notice is:", "What it could grow into in the future", "How it would actually work and what it would cost"], "SNs3": ["After visiting an exhibition for the first time, what you remember best is:", "The details: colors, materials, how things were arranged", "The overall impression and what it reminded you of"], "TFs1": ["A friend tells you their boss criticized them at work. Your first response is closer to:", "Comforting them and showing you understand how they feel", "Helping them analyze what went wrong and what to do next"], "TFs2": ["You must pick one of two teammates for an important task. You weigh more heavily:", "Whose skills fit the task best", "Who needs the opportunity most and how the choice affects the team"], "TFs3": ["A colleague's proposal has an obvious flaw. In the meeting, you are more likely to:", "Point it out directly, since that helps the work most", "Praise the strengths first and mention the flaw privately later"], "JPs1": ["Planning a three-day trip, you are more likely to:", "Book each day's itinerary and restaurants in advance", "Book only the hotel and figure out the rest when you arrive"], "JPs2": ["For a report due in two weeks, you usually:", "Do most of it in a focused push in the last few days", "Set a schedule and finish it bit by bit"], "JPs3": ["You suddenly get a free day on the weekend. You would rather:", "Go with your mood and do whatever comes to mind", "List what you want to do and put it in order"], "EIc": "Chatting with people I don't know takes real effort for me.", "SNc": "Discussing abstract theories quickly bores me.", "TFc": "When deciding, I go with my gut feeling more often than I weigh pros and cons.", "JPc": "Before going out or traveling, I usually don't plan ahead.", "Ni1": "I often have a strong sense of how things will turn out, even without a clear reason.", "Ni2": "I tend to pull many clues together into one core idea or direction.", "Ne1": "One idea often leads me to a chain of more ideas that is hard to stop.", "Ne2": "I like exploring many possibilities at once rather than settling on one answer early.", "Si1": "I compare the present situation with past experience to decide what to do.", "Si2": "I am deeply attached to familiar routines, tastes or places.", "Se1": "I am very alert to changes around me and react to them right away.", "Se2": "I prefer to jump in and experience things directly rather than think too much first.", "Ti1": "I need to work out the reasoning myself before I truly accept something.", "Ti2": "I notice when someone's statement is imprecise or contradicts itself.", "Te1": "I set goals, lay out the steps and get things done efficiently.", "Te2": "I judge a method mainly by whether it produces real results.", "Fi1": "Even if no one would ever know, I won't act against my own principles.", "Fi2": "I know clearly what truly matters to me, and others' opinions don't sway it much.", "Fe1": "I naturally adjust how I speak so that everyone present feels at ease.", "Fe2": "When someone in a group seems upset, I usually notice quickly and want to do something.", "Ns1": ["When starting a new project, you more often:", "Quickly see one clear direction and focus on moving toward it", "Brainstorm a pile of possible approaches and want to try each one"], "Ns2": ["When you hear an interesting new concept, you more often:", "Think of all the different places it could be applied", "Reflect on what it really means underneath"], "Ns3": ["When you think about the future, you are more like:", "Someone with one picture that keeps getting clearer", "Someone who sees many paths worth trying"], "Ss1": ["At a restaurant you visit often, you usually:", "Order the dish you always get, because you know it's good", "Look for what's new or special today and try it"], "Ss2": ["When learning a sport or a craft, you more often:", "Jump in and adjust by how it feels in your body", "Recall similar things you've learned and follow the steps"], "Ss3": ["Looking back on a trip, you are more like:", "Someone who remembers many details and compares them with earlier trips", "Someone who was fully absorbed in the moment but kept fewer details"], "Ts1": ["When solving a problem, you care more about:", "Understanding thoroughly why it happened", "Finding a workable fix quickly so things can move on"], "Ts2": ["When your team discusses how to do something, you more often:", "Propose roles, a timeline and ways to measure progress", "Check whether the logic of the approach holds together"], "Ts3": ["Someone says, \"This is the industry standard.\" You are more likely to:", "Follow it for now, since it has been proven to work", "Want to figure out for yourself why it makes sense"], "Fs1": ["Everyone agrees on a decision, but it feels wrong to you. You are more likely to:", "Hold your position, even if things get awkward", "Go along for now and raise it at a better moment"], "Fs2": ["When comforting a sad friend, you more often:", "Tune in to what they need and say what helps most right now", "Share how you honestly feel, even if it isn't what they want to hear"], "Fs3": ["When judging whether to do something, you more often ask yourself:", "Does this fit my own values?", "Is this good for everyone, and how will others feel?"], "Nec": "My thinking usually stays focused; I rarely jump from one idea to another.", "Sic": "When making decisions, I rarely look back to past experience.", "Tec": "I usually don't set goals and steps before I start working.", "Nic": "I rarely have any hunch about how things will develop."}, "deep": {"posNames": ["Hero", "Parent", "Child", "Inferior", "Opposing", "Critic", "Trickster", "Demon"], "posDesc": ["The function you trust and use most; you turn to it first.", "The function you use to care for yourself and others; mature and responsible, it keeps the hero in check.", "The source of play and creativity; fun to use, but not very stable.", "The function you are least sure of; it can make you anxious and is also your long-term growth direction.", "When others use this function against you, you tend to become defensive or stubborn.", "The picky inner voice, often used to criticize yourself and others.", "Your blind spot. You easily misjudge here or twist information without noticing.", "Your most unfamiliar function. Rarely used, it may surface destructively under extreme stress."], "health": {"Ni": ["Far-sighted; sees the essence of things and where they are heading", "Tunnel vision; treats hunches as facts and ignores contrary evidence"], "Ne": ["Full of ideas, eager to experiment, sees new possibilities", "Scattered; wants to do everything and finishes nothing"], "Si": ["Steady and reliable; builds wisdom from experience", "Resists change; stuck in the past or overly afraid of mistakes"], "Se": ["Present, responsive and decisive in action", "Impulsive and thrill-seeking, ignoring consequences"], "Ti": ["Precise thinking; independently sees the core of a problem", "Lost in details, nitpicking and dismissing others' views"], "Te": ["Efficient; turns goals into results", "Controlling; only results matter and people become tools"], "Fi": ["Authentic and principled; respects each person's uniqueness", "Self-absorbed, easily offended and unwilling to communicate"], "Fe": ["Considerate; brings people together and creates harmony", "People-pleasing to the point of losing oneself, or using emotion as pressure"]}, "grip": {"Se": "Normally focused on the long term, under heavy stress you may binge on food, shows or shopping and get lost in sensory indulgence.", "Ne": "Normally steady and grounded, under heavy stress you may start imagining every worst-case scenario.", "Si": "Normally upbeat and flexible, under heavy stress you may fixate on small details or minor body symptoms and replay past mistakes.", "Ni": "Normally living in the moment, under heavy stress you may suddenly feel dark premonitions about the future and suspect hidden meanings.", "Fe": "Normally calm and rational, under heavy stress you may become emotional, feel that no one cares and overreact to others.", "Fi": "Normally decisive and efficient, under heavy stress you may suddenly feel hurt and unappreciated, sinking into self-pity or outbursts.", "Te": "Normally gentle and accepting, under heavy stress you may turn sharp and critical, rush to control everything and blame others for inefficiency.", "Ti": "Normally warm and helpful, under heavy stress you may turn cold and critical, obsessively hunting for logical faults, including your own."}, "engage": {"Ni": "pause and ask where this is heading in the long run", "Ne": "talk it over with someone and list three different possibilities", "Si": "return to a steady routine and draw on what has worked before", "Se": "get out of your head, take a walk, exercise and engage with real people and things", "Ti": "slow down and check whether the idea holds up logically", "Te": "set one small goal, write down the steps and finish one thing", "Fi": "ask yourself what you truly care about", "Fe": "talk to someone you trust and hear how others feel and think"}, "healthEx": {"Ni": ["Halfway through a project you sense the direction is off and adjust early, which later turns out to avoid a major problem.", "You decide a colleague is definitely out to get you and keep trusting that hunch even after they explain."], "Ne": ["When a meeting stalls, you toss out five approaches in a row and one becomes the solution.", "This month you started three new projects and signed up for two courses, and finished none of them."], "Si": ["You remember what went wrong at last year's event and prepare a backup plan this year.", "The new system is clearly easier, but you insist on the way it has always been done and refuse to try it."], "Se": ["Equipment fails on site, you find a substitute right away and the event goes on.", "On a whim you buy something very expensive, or drop something important to go have fun."], "Ti": ["While everyone follows the usual routine, you spot a logical gap in the process, and fixing it halves the time.", "You argue for half an hour over whether a word is precise and forget what you were trying to solve."], "Te": ["You break a messy project into clear roles and a timeline so everyone finishes on time.", "A teammate takes leave for a family matter; you only care that the schedule slips and question their commitment to their face."], "Fi": ["Everyone says it is what people normally do, yet you politely decline to act against your principles.", "After one careless remark you decide the person disrespects you and turn cold toward them without explaining."], "Fe": ["You notice a new colleague eating alone and inv
